<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Numéro de lot — Boulangerie Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FAF7F2; --surface:#FFFFFF; --ink:#241A14;
    --accent:#C68A2E; --accent-dark:#9C6B1E; --radius:18px;
  }
  *{box-sizing:border-box;}
  body{font-family:'Inter',Arial,sans-serif; margin:0; background:var(--bg); color:var(--ink);}
  header{background:var(--ink); color:#fff; padding:22px 20px; display:flex; align-items:center; justify-content:space-between;}
  header h1{margin:0; font-family:'Fraunces',serif; font-size:22px;}
  header a{color:#fff; opacity:.7; text-decoration:none; font-size:13px;}
  main{padding:20px; max-width:700px; margin:auto;}
  .card{background:var(--surface); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .card h2{margin-top:0; font-family:'Fraunces',serif; font-size:19px;}
  label{display:block; font-size:13px; opacity:.7; margin:10px 0 4px;}
  input{width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; font-size:15px; font-family:inherit;}
  input[type="date"]{max-width:100%; min-width:0; box-sizing:border-box;}
  button.primary{
    margin-top:16px; width:100%; border:none; background:var(--accent); color:#241A14;
    padding:14px; border-radius:12px; font-size:16px; font-weight:600;
  }
  button.primary:active{transform:scale(0.98); }
  button.primary:disabled{opacity:.5;}
  .reception{display:flex; gap:14px; align-items:center; padding:14px 0; border-bottom:1px solid #eee;}
  .reception:last-child{border-bottom:none;}
  .reception small{opacity:.6;}
  .empty{opacity:.5; font-size:14px; padding:10px 0;}
</style>
</head>
<body>

<header style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
  <a href="index.html" title="Accueil" style="display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; width:52px; height:52px; border-radius:50%; background:var(--accent); color:#241A14; text-decoration:none; font-size:24px;">🏠</a>
  <h1 style="margin:0; text-align:center; flex:1;">📁 Numéro de lot</h1>
  <div style="display:flex; flex-direction:column; align-items:center; flex-shrink:0;">
    <button onclick="effacerProfil()" title="Changer de profil" style="width:52px; height:52px; border-radius:50%; border:none; background:var(--accent); color:#241A14; font-size:26px; cursor:pointer; padding:0;">👨‍🍳</button>
    <span id="bandeau-profil" style="font-size:10px; opacity:.8; margin-top:3px; text-align:center;"></span>
  </div>
</header>

<main id="zone-reception">
  <div class="card">
    <h2>Nouvelle réception</h2>
    <label>Produit</label>
    <input id="produit-reception" placeholder="ex: Farine T65">

    <label>Numéro de lot</label>
    <input id="lot-reception" placeholder="ex: L2456A">

    <label>Date de réception</label>
    <input id="date-reception" type="date">

    <button class="primary" id="btn-enregistrer" onclick="ajouterReception()">Enregistrer la réception</button>
  </div>

  <div class="card">
    <h2>Réceptions des 3 derniers mois</h2>
    <div id="liste-receptions"><p class="empty">Chargement...</p></div>
    <button class="primary" onclick="telechargerCSV()">⬇️ Télécharger la liste (Excel)</button>
  </div>
</main>

<script src="supabase-config.js?v=6"></script>
<script src="profil.js?v=7"></script>
<script>

function formaterDateAffichage(dateStr) {
  const [an, mois, jour] = dateStr.split('-');
  return `${jour}/${mois}/${an}`;
}

let derniereListeReceptions = [];

async function chargerReceptions() {
  const conteneur = document.getElementById('liste-receptions');
  const troisMoisAvant = new Date();
  troisMoisAvant.setMonth(troisMoisAvant.getMonth() - 3);
  const dateLimite = dateLocale(troisMoisAvant);

  const { data, error } = await supabaseClient
    .from('receptions')
    .select('*')
    .gte('date_reception', dateLimite)
    .order('date_reception', { ascending: false });

  if (error) { conteneur.innerHTML = `<p class="empty">Erreur : ${error.message}</p>`; return; }

  derniereListeReceptions = data || [];

  if (derniereListeReceptions.length === 0) { conteneur.innerHTML = `<p class="empty">Aucune réception enregistrée sur les 3 derniers mois.</p>`; return; }

  conteneur.innerHTML = derniereListeReceptions.map(r => `
    <div class="reception">
      <div style="width:64px;height:64px;border-radius:10px;background:#eee;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;">🏷️</div>
      <div style="flex:1;">
        <strong>${r.produit}</strong><br>
        <small>Lot ${r.numero_lot} · ${formaterDateAffichage(r.date_reception)}${r.enregistre_par ? ' · ' + r.enregistre_par : ''}</small>
      </div>
    </div>
  `).join('');
}

function telechargerCSV() {
  if (!derniereListeReceptions.length) {
    alert('Aucune réception à télécharger.');
    return;
  }

  const lignes = [['Produit', 'Numéro de lot', 'Date de réception', 'Enregistré par']];
  derniereListeReceptions.forEach(r => {
    lignes.push([r.produit, r.numero_lot, formaterDateAffichage(r.date_reception), r.enregistre_par || '']);
  });

  const csv = lignes.map(l => l.map(champ => `"${String(champ).replace(/"/g, '""')}"`).join(';')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const lien = document.createElement('a');
  lien.href = url;
  lien.download = 'receptions_matieres_premieres_' + dateLocale() + '.csv';
  document.body.appendChild(lien);
  lien.click();
  document.body.removeChild(lien);
  URL.revokeObjectURL(url);
}

async function ajouterReception() {
  const bouton = document.getElementById('btn-enregistrer');
  const produit = document.getElementById('produit-reception').value.trim();
  const numero_lot = document.getElementById('lot-reception').value.trim();
  const date_reception = document.getElementById('date-reception').value || dateLocale();
  const enregistre_par = window.profilActuel ? window.profilActuel.nom : null;

  if (!produit || !numero_lot) {
    alert('Merci de renseigner au moins le produit et le numéro de lot.');
    return;
  }

  bouton.disabled = true;
  bouton.textContent = 'Enregistrement...';

  const { error } = await supabaseClient.from('receptions').insert([
    { produit, numero_lot, date_reception, enregistre_par }
  ]);

  bouton.disabled = false;
  bouton.textContent = 'Enregistrer la réception';

  if (error) { alert('Erreur : ' + error.message); return; }

  document.getElementById('produit-reception').value = '';
  document.getElementById('lot-reception').value = '';
  document.getElementById('date-reception').value = dateLocale();
  chargerReceptions();
}

// Réservé au chef : seul lui peut enregistrer et consulter les réceptions
initProfil((profil) => {
  window.profilActuel = profil;

  if (profil.role !== 'chef') {
    document.getElementById('zone-reception').innerHTML =
      '<div class="card"><p class="empty">Cette page est réservée au chef.</p></div>';
    return;
  }

  document.getElementById('date-reception').value = dateLocale();
  chargerReceptions();
});

</script>
</body>
</html>
