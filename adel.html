<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production — Adel</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{--bg:#FAF7F2;--ink:#241A14;--accent:#C68A2E;}
  *{box-sizing:border-box;}
  body{font-family:'Inter',Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink);}
  header{background:var(--ink);color:#fff;padding:22px 20px;display:flex;justify-content:space-between;align-items:center;}
  header h1{margin:0;font-family:'Fraunces',serif;font-size:22px;}
  main{padding:20px;max-width:500px;margin:auto;}
  .card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .date{opacity:.6;margin:0 0 20px;}
  .ligne{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:20px;}
  .ligne span{flex:1;font-weight:600;}
  .ligne input{width:120px;padding:16px;font-size:24px;text-align:center;border-radius:12px;border:1px solid #ddd;}
  button.primary{width:100%;border:none;background:var(--accent);color:var(--ink);padding:18px;border-radius:14px;font-size:20px;font-weight:600;}
  .pieces{margin:-8px 0 18px;text-align:right;font-size:18px;opacity:.7;}
  .card{margin-bottom:16px;}
  .card h2{margin:0 0 12px;font-family:'Fraunces',serif;font-size:20px;}
  .cmd{border-top:1px solid #eee;padding:10px 0;}
  .cmd:first-of-type{border-top:none;}
  .cmd b{font-size:17px;}
  .cmd .heure{opacity:.6;font-size:14px;float:right;}
  .cmd div{font-size:16px;margin-top:4px;}
  .vide{opacity:.5;margin:0;}
  #ok{text-align:center;color:#2E7D32;font-weight:600;height:24px;margin-top:12px;}
</style>
</head>
<body>
<header><h1>🥖 Production</h1><div style="text-align:right;"><span id="bandeau-profil"></span><br><a href="#" onclick="effacerProfil();return false;" style="color:#fff;opacity:.8;font-size:13px;">🔄 Changer de profil</a></div></header>
<main>
  <div class="card">
    <h2>📋 Commandes de la journée <small style="font-weight:400;opacity:.6;font-size:14px;">(14h – 20h)</small></h2>
    <div id="commandes-jour"><p class="vide">Chargement...</p></div>
  </div>
  <div class="card">
    <p class="date" id="date-jour"></p>
    <div class="ligne"><span>Tradition <small style="font-weight:400;opacity:.6;">(bacs)</small></span><input type="number" inputmode="numeric" min="0" id="prod-Tradition" placeholder="0" oninput="majPieces()"></div>
    <div id="pieces-Tradition" class="pieces"></div>
    <div class="ligne"><span>Tradition pas cuite <small style="font-weight:400;opacity:.6;">(pâte fermentée, en pièces)</small></span><input type="number" inputmode="numeric" min="0" id="prod-pas-cuite" placeholder="0" oninput="majPieces()"></div>
    <div class="ligne"><span>Graines <small style="font-weight:400;opacity:.6;">(bacs)</small></span><input type="number" inputmode="numeric" min="0" id="prod-Graines" placeholder="0" oninput="majPieces()"></div>
    <div id="pieces-Graines" class="pieces"></div>
    <div class="ligne"><span>Héritage <small style="font-weight:400;opacity:.6;">(bacs)</small></span><input type="number" inputmode="numeric" min="0" id="prod-Héritage" placeholder="0" oninput="majPieces()"></div>
    <div id="pieces-Héritage" class="pieces"></div>
    <button class="primary" onclick="enregistrer()">Enregistrer</button>
    <div id="ok"></div>
  </div>
</main>
<script src="supabase-config.js?v=6"></script>
<script src="profil.js?v=9"></script>
<script>
const PRODUITS = ['Tradition', 'Graines', 'Héritage'];
const PAS_CUITE = 'Tradition pas cuite';
const PIECES_PAR_BAC = 20;

function majPieces() {
  PRODUITS.forEach(nom => {
    const bacs = parseFloat(document.getElementById('prod-' + nom).value) || 0;
    let txt = bacs > 0 ? '= ' + (bacs * PIECES_PAR_BAC) + ' pièces' : '';
    if (nom === 'Tradition' && bacs > 0) {
      const pc = parseFloat(document.getElementById('prod-pas-cuite').value) || 0;
      if (pc > 0) txt += ' − ' + pc + ' pas cuites = ' + (bacs * PIECES_PAR_BAC - pc) + ' cuites';
    }
    document.getElementById('pieces-' + nom).textContent = txt;
  });
}

function echapper(t) {
  return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

async function chargerCommandes() {
  const zone = document.getElementById('commandes-jour');
  const { data, error } = await supabaseClient.from('commandes').select('*')
    .eq('date_retrait', dateLocale()).neq('statut', 'annule')
    .gte('heure_retrait', '14:00').lte('heure_retrait', '20:00')
    .or('atelier.eq.boulangerie,atelier.is.null')
    .order('heure_retrait', { ascending: true });
  if (error) { zone.innerHTML = '<p class="vide">Erreur : ' + echapper(error.message) + '</p>'; return; }
  const groupes = {};
  (data || []).forEach(c => {
    if (c.recupere) return;
    const cle = c.client + '|' + (c.heure_retrait || '');
    (groupes[cle] = groupes[cle] || { client: c.client, heure: c.heure_retrait, lignes: [] }).lignes.push(c);
  });
  const liste = Object.values(groupes);
  if (liste.length === 0) { zone.innerHTML = '<p class="vide">Aucune commande entre 14h et 20h.</p>'; return; }
  zone.innerHTML = liste.map(g => `
    <div class="cmd">
      <b>${echapper(g.client)}</b><span class="heure">${g.heure ? g.heure.slice(0, 5) : ''}</span>
      ${g.lignes.map(l => `<div>${echapper(l.quantite)} × ${echapper(l.produit)}${l.notes ? ' <small style="opacity:.6;">(' + echapper(l.notes) + ')</small>' : ''}</div>`).join('')}
    </div>`).join('');
}

async function enregistrer() {
  const date = dateLocale();
  const par = window.profilActuel ? window.profilActuel.nom : null;
  const pasCuite = parseFloat(document.getElementById('prod-pas-cuite').value) || 0;
  const lignes = PRODUITS.map(nom => ({
    produit: nom, unite: 'pièce',
    quantite: (parseFloat(document.getElementById('prod-' + nom).value) || 0) * PIECES_PAR_BAC - (nom === 'Tradition' ? pasCuite : 0),
    date_production: date, atelier: 'boulangerie', enregistre_par: par
  }));
  lignes.push({ produit: PAS_CUITE, unite: 'pièce', quantite: pasCuite, date_production: date, atelier: 'boulangerie', enregistre_par: par });
  const { error } = await supabaseClient.from('production_jour').upsert(lignes, { onConflict: 'produit,atelier,date_production' });
  const ok = document.getElementById('ok');
  if (error) { ok.style.color = '#B00020'; ok.textContent = 'Erreur : ' + error.message; return; }
  ok.style.color = '#2E7D32'; ok.textContent = '✅ Enregistré';
}

initProfil(async (profil) => {
  window.profilActuel = profil;
  if (profil.nom.trim().toLowerCase() !== 'adel' && profil.role !== 'chef') { location.href = 'index.html'; return; }
  const date = dateLocale();
  document.getElementById('date-jour').textContent = new Date().toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
  const { data } = await supabaseClient.from('production_jour').select('*')
    .eq('date_production', date).eq('atelier', 'boulangerie').in('produit', PRODUITS.concat([PAS_CUITE]));
  const lu = {};
  (data || []).forEach(l => { lu[l.produit] = parseFloat(l.quantite) || 0; });
  const pc = lu[PAS_CUITE] || 0;
  if (pc > 0) document.getElementById('prod-pas-cuite').value = pc;
  PRODUITS.forEach(nom => {
    const pieces = (lu[nom] || 0) + (nom === 'Tradition' ? pc : 0);
    if (pieces > 0) document.getElementById('prod-' + nom).value = Math.round(pieces / PIECES_PAR_BAC * 10) / 10;
  });
  majPieces();
  chargerCommandes();
  supabaseClient.channel('commandes-adel')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'commandes' }, chargerCommandes)
    .subscribe();
});
</script>
</body>
</html>
