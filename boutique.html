<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boutique — Boulangerie Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FAF7F2; --surface:#FFFFFF; --ink:#241A14;
    --accent:#C68A2E; --accent-dark:#9C6B1E;
    --danger:#B00020; --success:#16803C; --radius:18px;
  }
  *{box-sizing:border-box;}
  body{font-family:'Inter',Arial,sans-serif; margin:0; background:var(--bg); color:var(--ink);}
  header{background:var(--ink); color:#fff; padding:22px 20px; display:flex; align-items:center; justify-content:space-between;}
  header h1{margin:0; font-family:'Fraunces',serif; font-size:22px;}
  header a{color:#fff; opacity:.7; text-decoration:none; font-size:13px;}
  main{padding:20px; max-width:700px; margin:auto;}
  .card{background:var(--surface); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .card h2{margin-top:0; font-family:'Fraunces',serif; font-size:19px;}
  label{display:block; font-size:13px; opacity:.7; margin:10px 0 4px;}
  input, select{width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; font-size:15px; font-family:inherit;}
  input[type="date"]{max-width:100%; min-width:0; box-sizing:border-box;}
  .row{display:flex; gap:10px;}
  .row > div{flex:1;}
  button.primary{
    margin-top:16px; width:100%; border:none; background:var(--accent); color:#241A14;
    padding:14px; border-radius:12px; font-size:16px; font-weight:600;
  }
  button.primary:active{transform:scale(0.98);}
  .bouton-section{
    display:block; width:100%; border:none; background:var(--ink); color:#fff;
    padding:18px; border-radius:16px; font-size:16px; font-weight:600;
    font-family:'Fraunces',serif; margin-bottom:14px; text-align:left;
    text-decoration:none; box-sizing:border-box;
  }
  .bouton-section:active{transform:scale(0.98);}
  .raccourci{
    flex:1; background:var(--surface); border:none; border-radius:14px; padding:14px 6px;
    text-decoration:none; color:var(--ink); text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.06);
    display:flex; flex-direction:column; align-items:center; gap:6px; font-size:13px; font-weight:600;
    font-family:inherit; cursor:pointer;
  }
  .raccourci:active{transform:scale(0.97);}
  .commande{padding:14px 0; border-bottom:1px solid #eee;}
  .commande:last-child{border-bottom:none;}
  .commande-top{display:flex; justify-content:space-between; align-items:center;}
  .commande-top strong{font-size:15px;}
  .commande small{opacity:.6;}
  .statut{
    font-size:12px; font-weight:600; padding:4px 10px; border-radius:20px; white-space:nowrap;
  }
  .statut.a_faire{background:#f1e4c8; color:#7a5a12;}
  .statut.en_cours{background:#dcebf7; color:#1a5a8a;}
  .statut.pret{background:#dcf3e3; color:var(--success);}
  .statut.recupere{background:#eee; color:#888;}
  .statut.annule{background:#f4e4e4; color:#999; text-decoration:line-through;}
  select.statut-select{margin-top:8px; font-size:13px; padding:6px;}
  .empty{opacity:.5; font-size:14px; padding:10px 0;}
</style>
</head>
<body>

<header style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
  <a href="index.html" title="Accueil" style="display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; width:52px; height:52px; border-radius:50%; background:var(--accent); color:#241A14; text-decoration:none; font-size:24px;">🏠</a>
  <h1 style="margin:0; text-align:center; flex:1;">🛎️ Boutique</h1>
  <div style="display:flex; flex-direction:column; align-items:center; flex-shrink:0;">
    <button onclick="effacerProfil()" title="Changer de profil" style="width:52px; height:52px; border-radius:50%; border:none; background:var(--accent); color:#241A14; font-size:26px; cursor:pointer; padding:0;">👨‍🍳</button>
    <span id="bandeau-profil" style="font-size:10px; opacity:.8; margin-top:3px; text-align:center;"></span>
  </div>
</header>

<main>
  <div class="card">
    <h2>Nouvelle commande</h2>
    <label>Nom du client</label>
    <input id="client" placeholder="ex: Mme Dupont">

    <label>Téléphone (optionnel)</label>
    <input id="telephone" type="tel" placeholder="ex: 06 12 34 56 78">

    <label>Produit</label>
    <input id="produit" placeholder="ex: Tarte aux fraises">

    <label>Atelier concerné</label>
    <select id="atelier-commande">
      <option value="patisserie">🧁 Pâtisserie (gâteau, tarte, viennoiserie...)</option>
      <option value="boulangerie">🍞 Boulangerie (pain...)</option>
    </select>

    <div class="row">
      <div>
        <label>Date de retrait</label>
        <input id="date_retrait" type="date">
      </div>
      <div>
        <label>Heure de retrait</label>
        <input id="heure_retrait" type="time">
      </div>
    </div>

    <div class="row">
      <div>
        <label>Quantité</label>
        <input id="quantite" type="number" min="1" value="1">
      </div>
      <div></div>
    </div>

    <label>Notes (allergies, précisions...)</label>
    <input id="notes" placeholder="optionnel">

    <button class="primary" onclick="ajouterCommande()">Ajouter la commande</button>
  </div>

  <div class="card">
    <h2>📋 Commandes à venir</h2>
    <div style="display:flex; align-items:center; gap:8px; margin-bottom:10px;">
      <button onclick="changerSemaineCommandes(-1)" style="border:none; background:#f1e4c8; border-radius:8px; padding:8px 14px; font-size:16px; color:#241A14;">◀</button>
      <span id="label-semaine-commandes" style="flex:1; text-align:center; font-size:13px; opacity:.7;"></span>
      <button onclick="changerSemaineCommandes(1)" style="border:none; background:#f1e4c8; border-radius:8px; padding:8px 14px; font-size:16px; color:#241A14;">▶</button>
    </div>
    <div id="liste-commandes">
      <p class="empty">Chargement...</p>
    </div>
  </div>

  <div style="display:flex; gap:10px; margin-bottom:16px;">
    <button onclick="ouvrirModalMessage()" class="raccourci">
      <span style="font-size:24px;">💬</span>
      <span>Message pour le labo</span>
    </button>
    <button onclick="ouvrirModalRecurrence()" class="raccourci">
      <span style="font-size:24px;">🔁</span>
      <span>Commande récurrente</span>
    </button>
    <a href="client-fidele.html?atelier=vente" class="raccourci">
      <span style="font-size:24px;">📒</span>
      <span>Facture clients</span>
    </a>
    <a href="magasin.html" class="raccourci">
      <span style="font-size:24px;">🛒</span>
      <span>Commande magasin</span>
    </a>
    <a href="catalogue.html" class="raccourci">
      <span style="font-size:24px;">🖼️</span>
      <span>Catalogue produits</span>
    </a>
  </div>

  <div class="card">
    <h2>🔍 Retrouver une commande client</h2>
    <input id="recherche-client" placeholder="Nom du client..." oninput="rechercherCommandesClient()">
    <div id="resultats-recherche" style="margin-top:10px;"></div>
  </div>
</main>

<script src="supabase-config.js?v=6"></script>
<script src="profil.js?v=6"></script>
<script>

// Vérifie que l'heure choisie tombe bien dans les horaires d'ouverture
// (6h-13h30 et 15h30-19h30, coupure du midi exclue)
function dansHorairesOuverture(heure) {
  if (!heure) return true; // heure non précisée = ok
  const [h, m] = heure.split(':').map(Number);
  const minutes = h * 60 + m;
  const matin = minutes >= 6 * 60 && minutes <= 13 * 60 + 30;
  const apresMidi = minutes >= 15 * 60 + 30 && minutes <= 19 * 60 + 30;
  return matin || apresMidi;
}
let derniereListeCommandesSemaine = [];
let joursSemaineCommandes = [];
let datesSemaineCommandes = [];
let jourSelectionneCommandes = null;
let decalageSemaineCommandes = 0;

async function chargerCommandes() {
  const aujourdhui = new Date();
  joursSemaineCommandes = [];
  datesSemaineCommandes = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(aujourdhui);
    d.setDate(aujourdhui.getDate() + decalageSemaineCommandes * 7 + i);
    datesSemaineCommandes.push(d);
    joursSemaineCommandes.push(dateLocale(d));
  }

  document.getElementById('label-semaine-commandes').textContent =
    joursSemaineCommandes[0].slice(8,10) + '/' + joursSemaineCommandes[0].slice(5,7) +
    ' - ' + joursSemaineCommandes[6].slice(8,10) + '/' + joursSemaineCommandes[6].slice(5,7);

  const { data, error } = await supabaseClient
    .from('commandes')
    .select('*')
    .gte('date_retrait', joursSemaineCommandes[0])
    .lte('date_retrait', joursSemaineCommandes[6])
    .or('client.neq."Casino Shop",produit.in.("Bûcheron","Complet")')
    .order('heure_retrait', { ascending: true });

  const conteneur = document.getElementById('liste-commandes');

  if (error) {
    conteneur.innerHTML = `<p class="empty">Erreur de chargement : ${error.message}</p>`;
    return;
  }

  derniereListeCommandesSemaine = data || [];
  jourSelectionneCommandes = joursSemaineCommandes[0];
  afficherCommandes();
}

function changerSemaineCommandes(direction) {
  decalageSemaineCommandes = Math.max(0, decalageSemaineCommandes + direction);
  chargerCommandes();
}

function afficherCommandes() {
  const conteneur = document.getElementById('liste-commandes');

  const tuiles = joursSemaineCommandes.map((j, i) => {
    const nb = derniereListeCommandesSemaine.filter(c => c.date_retrait === j).length;
    const actif = jourSelectionneCommandes === j;
    return `
      <div onclick="selectionnerJourCommandes('${j}')" style="cursor:pointer; text-align:center; padding:10px 6px; border-radius:10px; background:${actif ? '#f1e4c8' : '#f7f4ee'}; min-width:58px; flex-shrink:0;">
        <div style="font-size:11px; opacity:.6; text-transform:capitalize;">${datesSemaineCommandes[i].toLocaleDateString('fr-FR', { weekday: 'short' })}</div>
        <div style="font-size:13px; font-weight:600;">${j.slice(8,10)}/${j.slice(5,7)}</div>
        <div style="font-size:16px; font-weight:700; color:var(--accent-dark); margin-top:4px;">${nb}</div>
      </div>`;
  }).join('');

  const commandesDuJour = derniereListeCommandesSemaine.filter(c => c.date_retrait === jourSelectionneCommandes);

  let html = `<div style="display:flex; gap:8px; overflow-x:auto; padding-bottom:6px;">${tuiles}</div>`;
  html += `<div style="margin-top:14px;">`;
  html += commandesDuJour.length === 0
    ? `<p class="empty">Aucune commande ce jour-là.</p>`
    : commandesDuJour.map(c => `
      <div class="commande">
        <div class="commande-top">
          <div>
            <strong>${c.client}</strong> — ${c.produit} (x${c.quantite})<br>
            <small>${c.heure_retrait ? c.heure_retrait.slice(0,5) : 'Heure non précisée'}${c.telephone ? ' · 📞 ' + c.telephone : ''}${c.notes ? ' · ' + c.notes : ''}${c.prise_par ? ' · prise par ' + c.prise_par : ''}</small>
          </div>
          <span class="statut ${c.statut}">${libelleStatut(c.statut)}</span>
        </div>
        <select class="statut-select" onchange="changerStatut('${c.id}', this.value)">
          <option value="a_faire" ${c.statut==='a_faire'?'selected':''}>À faire</option>
          ${c.statut === 'pret' ? '<option value="pret" selected disabled>Prêt</option>' : ''}
          <option value="annule" ${c.statut==='annule'?'selected':''}>Annulée</option>
        </select>
      </div>
    `).join('');
  html += `</div>`;

  conteneur.innerHTML = html;
}

function selectionnerJourCommandes(j) {
  jourSelectionneCommandes = j;
  afficherCommandes();
}

function libelleStatut(s) {
  return { a_faire: 'À faire', pret: 'Prêt', annule: 'Annulée' }[s] || s;
}

async function rechercherCommandesClient() {
  const recherche = document.getElementById('recherche-client').value.trim();
  const conteneur = document.getElementById('resultats-recherche');

  if (!recherche) { conteneur.innerHTML = ''; return; }

  const { data, error } = await supabaseClient
    .from('commandes')
    .select('*')
    .ilike('client', '%' + recherche + '%')
    .order('date_retrait', { ascending: false })
    .limit(50);

  if (error) { conteneur.innerHTML = `<p class="empty">Erreur : ${error.message}</p>`; return; }
  if (!data || data.length === 0) { conteneur.innerHTML = `<p class="empty">Aucune commande trouvée.</p>`; return; }

  conteneur.innerHTML = data.map(c => `
    <div class="commande">
      <div class="commande-top">
        <div>
          <strong>${c.client}</strong> — ${c.produit} (x${c.quantite})<br>
          <small>${c.date_retrait.split('-').reverse().join('/')}${c.heure_retrait ? ' à ' + c.heure_retrait.slice(0,5) : ''}${c.telephone ? ' · 📞 ' + c.telephone : ''}${c.notes ? ' · ' + c.notes : ''}</small>
        </div>
        <span class="statut ${c.statut}">${libelleStatut(c.statut)}</span>
      </div>
    </div>
  `).join('');
}

function ouvrirModalMessage() {
  const overlay = document.createElement('div');
  overlay.id = 'overlay-message';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(36,26,20,.6);display:flex;align-items:center;justify-content:center;z-index:9998;padding:20px;';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:18px;padding:24px;max-width:380px;width:100%;">
      <h2 style="font-family:'Fraunces',serif;margin-top:0;">💬 Message pour le labo</h2>
      <label style="display:block;font-size:13px;opacity:.7;margin:10px 0 4px;">Concerne</label>
      <select id="atelier-message" onchange="mettreAJourExempleMessage()" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:15px;">
        <option value="patisserie">🧁 Pâtisserie</option>
        <option value="boulangerie">🍞 Boulangerie</option>
      </select>
      <label style="display:block;font-size:13px;opacity:.7;margin:10px 0 4px;">Message</label>
      <input id="texte-message" placeholder="ex: Plus de chouquettes aujourd'hui" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:15px;">
      <button class="primary" onclick="envoyerMessage()">Envoyer</button>
      <button onclick="fermerModalMessage()" style="width:100%;border:none;background:none;color:#999;padding:10px;margin-top:6px;font-size:14px;">Annuler</button>
    </div>`;
  document.body.appendChild(overlay);
}

function fermerModalMessage() {
  const overlay = document.getElementById('overlay-message');
  if (overlay) overlay.remove();
}

// ---------- COMMANDES RÉCURRENTES ----------
const NOMS_JOURS = { 1: 'Lun', 2: 'Mar', 3: 'Mer', 4: 'Jeu', 5: 'Ven', 6: 'Sam', 7: 'Dim' };

async function ouvrirModalRecurrence() {
  const overlay = document.createElement('div');
  overlay.id = 'overlay-recurrence';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(36,26,20,.6);display:flex;align-items:center;justify-content:center;z-index:9998;padding:20px;overflow-y:auto;';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:18px;padding:24px;max-width:420px;width:100%;max-height:90vh;overflow-y:auto;">
      <h2 style="font-family:'Fraunces',serif;margin-top:0;">🔁 Nouvelle récurrence</h2>

      <label style="display:block;font-size:13px;opacity:.7;margin:10px 0 4px;">Client</label>
      <input id="recur-client" placeholder="ex: Mme Dupont" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:15px;">

      <label style="display:block;font-size:13px;opacity:.7;margin:10px 0 4px;">Produit</label>
      <input id="recur-produit" placeholder="ex: Pain de campagne" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:15px;">

      <label style="display:block;font-size:13px;opacity:.7;margin:10px 0 4px;">Atelier</label>
      <select id="recur-atelier" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:15px;">
        <option value="boulangerie">🍞 Boulangerie</option>
        <option value="patisserie">🧁 Pâtisserie</option>
      </select>

      <label style="display:block;font-size:13px;opacity:.7;margin:10px 0 4px;">Quantité</label>
      <input id="recur-quantite" type="number" min="1" value="1" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:15px;">

      <label style="display:block;font-size:13px;opacity:.7;margin:10px 0 4px;">Heure de retrait (optionnel)</label>
      <input id="recur-heure" type="time" style="width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;font-size:15px;">

      <label style="display:block;font-size:13px;opacity:.7;margin:12px 0 6px;">Jours de la semaine</label>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
        ${Object.keys(NOMS_JOURS).map(j => `
          <label style="display:flex;flex-direction:column;align-items:center;font-size:12px;gap:4px;">
            <input type="checkbox" value="${j}" class="recur-jour" style="width:auto;">
            ${NOMS_JOURS[j]}
          </label>
        `).join('')}
      </div>

      <button class="primary" onclick="creerRecurrence()">Créer la récurrence</button>
      <button onclick="fermerModalRecurrence()" style="width:100%;border:none;background:none;color:#999;padding:10px;margin-top:6px;font-size:14px;">Annuler</button>

      <h3 style="font-family:'Fraunces',serif;margin:20px 0 10px;font-size:16px;">Récurrences existantes</h3>
      <div id="liste-recurrences"><p style="opacity:.5;font-size:14px;">Chargement...</p></div>
    </div>`;
  document.body.appendChild(overlay);
  chargerRecurrences();
}

function fermerModalRecurrence() {
  const overlay = document.getElementById('overlay-recurrence');
  if (overlay) overlay.remove();
}

async function creerRecurrence() {
  const client = document.getElementById('recur-client').value.trim();
  const produit = document.getElementById('recur-produit').value.trim();
  const atelier = document.getElementById('recur-atelier').value;
  const quantite = parseInt(document.getElementById('recur-quantite').value) || 1;
  const heure_retrait = document.getElementById('recur-heure').value || null;
  const jours_semaine = Array.from(document.querySelectorAll('.recur-jour:checked')).map(c => parseInt(c.value));
  const cree_par = window.profilActuel ? window.profilActuel.nom : null;

  if (!client || !produit || jours_semaine.length === 0) {
    alert('Merci de renseigner le client, le produit et au moins un jour.');
    return;
  }

  const { error } = await supabaseClient.from('commandes_recurrentes').insert([
    { client, produit, atelier, quantite, heure_retrait, jours_semaine, cree_par }
  ]);

  if (error) { alert('Erreur : ' + error.message); return; }

  document.getElementById('recur-client').value = '';
  document.getElementById('recur-produit').value = '';
  document.getElementById('recur-quantite').value = 1;
  document.getElementById('recur-heure').value = '';
  document.querySelectorAll('.recur-jour').forEach(c => c.checked = false);

  chargerRecurrences();
  await genererCommandesRecurrentes();
  chargerCommandes();
}

async function chargerRecurrences() {
  const conteneur = document.getElementById('liste-recurrences');
  const { data, error } = await supabaseClient.from('commandes_recurrentes').select('*').order('client');

  if (error) { conteneur.innerHTML = `<p style="opacity:.5;font-size:14px;">Erreur : ${error.message}</p>`; return; }
  if (!data || data.length === 0) { conteneur.innerHTML = `<p style="opacity:.5;font-size:14px;">Aucune récurrence pour l'instant.</p>`; return; }

  conteneur.innerHTML = data.map(r => `
    <div style="border:1px solid #eee;border-radius:12px;padding:12px;margin-bottom:8px;${r.active ? '' : 'opacity:.5;'}">
      <strong>${r.client}</strong> — ${r.produit} (x${r.quantite})<br>
      <small style="opacity:.6;">${r.jours_semaine.map(j => NOMS_JOURS[j]).join(', ')}${r.heure_retrait ? ' · ' + r.heure_retrait.slice(0,5) : ''}</small>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <button onclick="basculerActifRecurrence('${r.id}', ${!r.active})" style="flex:1;border:none;background:${r.active ? '#f1e4c8' : '#dcf3e3'};color:#241A14;padding:8px;border-radius:8px;font-size:13px;">
          ${r.active ? '⏸️ Mettre en pause' : '▶️ Réactiver'}
        </button>
        <button onclick="supprimerRecurrence('${r.id}')" style="border:none;background:none;font-size:16px;opacity:.5;">🗑️</button>
      </div>
    </div>
  `).join('');
}

async function basculerActifRecurrence(id, nouvelEtat) {
  const { error } = await supabaseClient.from('commandes_recurrentes').update({ active: nouvelEtat }).eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  chargerRecurrences();
  if (nouvelEtat) { await genererCommandesRecurrentes(); chargerCommandes(); }
}

async function supprimerRecurrence(id) {
  if (!confirm('Supprimer définitivement cette récurrence ?')) return;
  const { error } = await supabaseClient.from('commandes_recurrentes').delete().eq('id', id);
  if (error) { alert('Erreur : ' + error.message); return; }
  chargerRecurrences();
}

// Génère les commandes à venir pour les 14 prochains jours à partir des récurrences actives
async function genererCommandesRecurrentes() {
  const { data: recurrences } = await supabaseClient.from('commandes_recurrentes').select('*').eq('active', true);
  if (!recurrences || recurrences.length === 0) return;

  const jours = [];
  const aujourdhui = new Date();
  for (let i = 0; i < 14; i++) {
    const d = new Date(aujourdhui);
    d.setDate(aujourdhui.getDate() + i);
    const isoJour = d.getDay() === 0 ? 7 : d.getDay();
    jours.push({ date: dateLocale(d), isoJour });
  }

  const nouvellesLignes = [];

  for (const r of recurrences) {
    const joursCorrespondants = jours.filter(j => r.jours_semaine.includes(j.isoJour));
    if (joursCorrespondants.length === 0) continue;

    const { data: existantes } = await supabaseClient
      .from('commandes')
      .select('date_retrait')
      .eq('client', r.client)
      .eq('produit', r.produit)
      .in('date_retrait', joursCorrespondants.map(j => j.date));

    const datesExistantes = new Set((existantes || []).map(e => e.date_retrait));

    joursCorrespondants.forEach(j => {
      if (!datesExistantes.has(j.date)) {
        nouvellesLignes.push({
          client: r.client, produit: r.produit, atelier: r.atelier,
          quantite: r.quantite, heure_retrait: r.heure_retrait,
          date_retrait: j.date, notes: 'Récurrence automatique'
        });
      }
    });
  }

  if (nouvellesLignes.length > 0) {
    await supabaseClient.from('commandes').insert(nouvellesLignes);
  }
}

async function ajouterCommande() {
  const client = document.getElementById('client').value.trim();
  const telephone = document.getElementById('telephone').value.trim() || null;
  const produit = document.getElementById('produit').value.trim();
  const atelier = document.getElementById('atelier-commande').value;
  const quantite = parseInt(document.getElementById('quantite').value) || 1;
  const date_retrait = document.getElementById('date_retrait').value || dateLocale();
  const heure_retrait = document.getElementById('heure_retrait').value || null;
  const notes = document.getElementById('notes').value.trim() || null;
  const prise_par = window.profilActuel ? window.profilActuel.nom : null;

  if (!client || !produit) {
    alert('Merci de remplir au moins le client et le produit.');
    return;
  }

  if (!dansHorairesOuverture(heure_retrait)) {
    alert("Cette heure tombe pendant la fermeture (13h30-15h30). Merci de choisir un créneau entre 6h et 13h30, ou entre 15h30 et 19h30.");
    return;
  }

  const { error } = await supabaseClient.from('commandes').insert([
    { client, telephone, produit, atelier, quantite, date_retrait, heure_retrait, notes, prise_par }
  ]);

  if (error) {
    alert('Erreur : ' + error.message);
    return;
  }

  document.getElementById('client').value = '';
  document.getElementById('telephone').value = '';
  document.getElementById('produit').value = '';
  document.getElementById('quantite').value = 1;
  document.getElementById('heure_retrait').value = '';
  document.getElementById('notes').value = '';
  document.getElementById('date_retrait').value = dateLocale();
  chargerCommandes();
}

async function changerStatut(id, statut) {
  const { error } = await supabaseClient.from('commandes').update({ statut }).eq('id', id);
  if (error) alert('Erreur : ' + error.message);
}

function mettreAJourExempleMessage() {
  const atelier = document.getElementById('atelier-message').value;
  document.getElementById('texte-message').placeholder =
    atelier === 'patisserie' ? "ex: Plus de chouquettes aujourd'hui" : "ex: Moins de pains spéciaux aujourd'hui";
}

async function envoyerMessage() {
  const atelier = document.getElementById('atelier-message').value;
  const message = document.getElementById('texte-message').value.trim();
  const auteur = window.profilActuel ? window.profilActuel.nom : null;

  if (!message) {
    alert('Merci d\'écrire un message.');
    return;
  }

  const { error } = await supabaseClient.from('messages_jour').insert([
    { atelier, message, auteur }
  ]);

  if (error) { alert('Erreur : ' + error.message); return; }

  fermerModalMessage();
}

// On attend de savoir qui utilise la tablette avant de charger la page
initProfil(async (profil) => {
  window.profilActuel = profil;
  document.getElementById('date_retrait').value = dateLocale();
  await genererCommandesRecurrentes();
  chargerCommandes();

  supabaseClient
    .channel('commandes-boutique')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'commandes' }, chargerCommandes)
    .subscribe();
}, 'vente');

</script>
