<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labo — Boulangerie Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FAF7F2; --surface:#FFFFFF; --ink:#241A14;
    --accent:#C68A2E; --accent-dark:#9C6B1E;
    --danger:#B00020; --success:#16803C; --radius:18px;
  }
  *{box-sizing:border-box;}
  body{font-family:'Inter',Arial,sans-serif; margin:0; background:var(--bg); color:var(--ink);}
  header{background:var(--ink); color:#fff; padding:22px 20px; display:flex; align-items:center; justify-content:space-between;}
  header h1{margin:0; font-family:'Fraunces',serif; font-size:22px;}
  header a{color:#fff; opacity:.7; text-decoration:none; font-size:13px;}
  main{padding:20px; max-width:700px; margin:auto;}
  .card{background:var(--surface); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .card h2{margin-top:0; font-family:'Fraunces',serif; font-size:19px;}
  label{display:block; font-size:13px; opacity:.7; margin:10px 0 4px;}
  input, select{width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; font-size:15px; font-family:inherit;}
  input[type="date"]{max-width:100%; min-width:0; box-sizing:border-box;}
  button.primary{
    margin-top:16px; width:100%; border:none; background:var(--accent); color:#241A14;
    padding:14px; border-radius:12px; font-size:16px; font-weight:600;
  }
  button.primary:active{transform:scale(0.98);}
  button.small{border:none; background:var(--ink); color:#fff; padding:10px 15px; border-radius:10px; font-size:14px;}
  .task, .commande, .dlc-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:14px 0; border-bottom:1px solid #eee;
  }
  .task:last-child, .commande:last-child, .dlc-item:last-child{border-bottom:none;}
  .task small, .commande small{opacity:.6; display:block; margin-top:2px;}
  .done{color:var(--success); font-weight:600; font-size:14px;}
  .alert{color:var(--danger); font-weight:600; font-size:14px;}
  .soon{color:var(--accent-dark); font-weight:600; font-size:14px;}
  .empty{opacity:.5; font-size:14px; padding:10px 0;}
  .raccourci{
    flex:1; background:var(--surface); border-radius:14px; padding:14px 6px;
    text-decoration:none; color:var(--ink); text-align:center; box-shadow:0 2px 8px rgba(0,0,0,.06);
    display:flex; flex-direction:column; align-items:center; gap:6px; font-size:13px; font-weight:600;
  }
  .raccourci:active{transform:scale(0.97);}
</style>
</head>
<body>

<header style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
  <a href="index.html" title="Accueil" style="display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; width:52px; height:52px; border-radius:50%; background:var(--accent); color:#241A14; text-decoration:none; font-size:24px;">🏠</a>
  <h1 id="titre-page" style="margin:0; text-align:center; flex:1;">🍞 Labo</h1>
  <div style="display:flex; flex-direction:column; align-items:center; flex-shrink:0;">
    <button onclick="effacerProfil()" title="Changer de profil" style="width:52px; height:52px; border-radius:50%; border:none; background:var(--accent); color:#241A14; font-size:26px; cursor:pointer; padding:0;">👨‍🍳</button>
    <span id="bandeau-profil" style="font-size:10px; opacity:.8; margin-top:3px; text-align:center;"></span>
  </div>
</header>

<main>
  <div style="display:flex; gap:10px; margin-bottom:16px;">
    <a href="#" id="lien-recettes" class="raccourci">
      <span style="font-size:24px;">📖</span>
      <span>Recettes</span>
    </a>
    <a href="reception.html" class="raccourci">
      <span style="font-size:24px;">📁</span>
      <span>Numéro de lot</span>
    </a>
    <a href="#" id="lien-temperatures" class="raccourci">
      <span style="font-size:24px;">🌡️</span>
      <span>Relevé des températures</span>
    </a>
    <a href="#" id="lien-haccp" class="raccourci">
      <span style="font-size:24px;">🏷️</span>
      <span>Étiquettes HACCP</span>
    </a>
    <a href="client-fidele.html?atelier=boulangerie" id="lien-casino" class="raccourci" style="display:none;">
      <span style="font-size:24px;">📒</span>
      <span>Casino Shop</span>
    </a>
    <a href="production.html" id="lien-production" class="raccourci" style="display:none;">
      <span style="font-size:24px;">🏭</span>
      <span>Production</span>
    </a>
    <a href="magasin-labo.html" id="lien-magasin" class="raccourci" style="display:none;">
      <span style="font-size:24px;">🛒</span>
      <span>Commande magasin</span>
    </a>
  </div>

  <div class="card">
    <h2>🗓️ Vue de la semaine</h2>
    <div id="vue-semaine" style="display:flex; gap:8px; overflow-x:auto; padding-bottom:4px;"></div>
  </div>

  <div class="card">
    <h2>📋 Commandes à préparer</h2>
    <label>Jour consulté</label>
    <input id="date-commandes" type="date" onchange="chargerCommandes()">
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;opacity:.8;">
      <input type="checkbox" id="toggle-tout" onchange="chargerCommandes()" style="width:auto;">
      Voir aussi les commandes déjà prêtes
    </label>
    <div id="liste-commandes" style="margin-top:10px;"><p class="empty">Chargement...</p></div>
  </div>

  <div class="card" id="card-ajout-tache">
    <h2>Ajouter une tâche</h2>
    <div id="raccourcis-taches" style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px;"></div>
    <label>Description</label>
    <input id="description-tache" placeholder="ex: Lancer le pétrin">
    <label>Assigner à (optionnel)</label>
    <select id="assigne-tache">
      <option value="">Tout le monde</option>
    </select>
    <button class="primary" onclick="ajouterTache()">Ajouter la tâche</button>
  </div>

  <div class="card">
    <h2>🧹 Tâches</h2>
    <div id="liste-taches"><p class="empty">Chargement...</p></div>
  </div>

  <div class="card">
    <h2>📦 DLC à surveiller</h2>
    <div id="liste-dlc"><p class="empty">Chargement...</p></div>
  </div>
</main>

<script src="supabase-config.js?v=6"></script>
<script src="profil.js?v=7"></script>
<script>

const params = new URLSearchParams(window.location.search);
const atelier = params.get('atelier') === 'patisserie' ? 'patisserie' : 'boulangerie';

document.getElementById('titre-page').textContent =
  atelier === 'patisserie' ? '🧁 Labo — Pâtisserie' : '🍞 Labo — Boulangerie';

document.getElementById('lien-recettes').href = 'recettes.html?atelier=' + atelier;
document.getElementById('lien-temperatures').href = 'temperatures.html?atelier=' + atelier;
document.getElementById('lien-haccp').href = 'haccp.html?atelier=' + atelier;

if (atelier === 'boulangerie') {
  document.getElementById('lien-production').style.display = 'flex';
  document.getElementById('lien-casino').style.display = 'flex';
}

if (atelier === 'patisserie') {
  document.getElementById('lien-magasin').style.display = 'flex';
}

// ---------- TÂCHES ----------
// Affiche des boutons rapides pour remplir la description sans tout retaper
async function chargerRaccourcisTaches() {
  const conteneur = document.getElementById('raccourcis-taches');
  if (!conteneur) return;

  const { data } = await supabaseClient.from('taches_recurrentes').select('*').eq('atelier', atelier).order('description');
  if (!data || data.length === 0) { conteneur.innerHTML = ''; return; }

  conteneur.innerHTML = data.map(t => `
    <button type="button" onclick='remplirDescriptionTache(${JSON.stringify(t.description)})' style="border:1px solid #ddd; background:#fff; color:var(--ink); padding:6px 12px; border-radius:20px; font-size:12px; cursor:pointer;">${t.description}</button>
  `).join('');
}

function remplirDescriptionTache(texte) {
  document.getElementById('description-tache').value = texte;
}

async function chargerTaches() {
  const conteneur = document.getElementById('liste-taches');
  const { data, error } = await supabaseClient
    .from('taches')
    .select('*')
    .eq('atelier', atelier)
    .eq('date_tache', dateLocale())
    .eq('fait', false)
    .order('created_at', { ascending: true });

  if (error) { conteneur.innerHTML = `<p class="empty">Erreur : ${error.message}</p>`; return; }
  if (!data || data.length === 0) { conteneur.innerHTML = `<p class="empty">Aucune tâche en attente.</p>`; return; }

  conteneur.innerHTML = data.map(t => `
    <div class="task">
      <span>${t.description}${t.assigne_a ? '<br><small>Assignée à ' + t.assigne_a + '</small>' : ''}</span>
      <button class="small" onclick="terminerTache('${t.id}')">Terminer</button>
    </div>
  `).join('');
}

async function ajouterTache() {
  const description = document.getElementById('description-tache').value.trim();
  const assigne_a = document.getElementById('assigne-tache').value || null;
  if (!description) { alert('Merci de décrire la tâche.'); return; }

  const { error } = await supabaseClient.from('taches').insert([{ description, atelier, assigne_a }]);
  if (error) { alert('Erreur : ' + error.message); return; }

  document.getElementById('description-tache').value = '';
  document.getElementById('assigne-tache').value = '';
}

async function terminerTache(id) {
  const { error } = await supabaseClient.from('taches')
    .update({ fait: true, termine_a: new Date().toISOString() })
    .eq('id', id);
  if (error) alert('Erreur : ' + error.message);
}

// ---------- VUE DE LA SEMAINE ----------
async function chargerVueSemaine() {
  const conteneur = document.getElementById('vue-semaine');
  const aujourdhui = new Date();

  const jours = [];
  const dates = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(aujourdhui);
    d.setDate(aujourdhui.getDate() + i);
    dates.push(d);
    jours.push(dateLocale(d));
  }

  const { data, error } = await supabaseClient
    .from('commandes')
    .select('date_retrait')
    .neq('statut', 'annule')
    .or(`atelier.eq.${atelier},atelier.is.null`)
    .gte('date_retrait', jours[0])
    .lte('date_retrait', jours[6]);

  if (error) { conteneur.innerHTML = `<p class="empty">Erreur : ${error.message}</p>`; return; }

  const compte = {};
  jours.forEach(j => compte[j] = 0);
  (data || []).forEach(c => { if (compte[c.date_retrait] !== undefined) compte[c.date_retrait]++; });

  const jourChoisi = document.getElementById('date-commandes').value || jours[0];

  conteneur.innerHTML = jours.map((j, i) => {
    const actif = j === jourChoisi;
    return `
    <div onclick="selectionnerJour('${j}')" style="cursor:pointer; text-align:center; padding:10px 6px; border-radius:10px; background:${actif ? 'var(--accent)' : '#f7f4ee'}; border:${actif ? '2px solid var(--accent-dark)' : '2px solid transparent'}; min-width:58px; flex-shrink:0; transform:${actif ? 'scale(1.05)' : 'none'};">
      <div style="font-size:11px; opacity:${actif ? '.85' : '.6'}; text-transform:capitalize; color:${actif ? '#241A14' : 'inherit'}; font-weight:${actif ? '700' : '400'};">${dates[i].toLocaleDateString('fr-FR', { weekday: 'short' })}</div>
      <div style="font-size:13px; font-weight:700; color:${actif ? '#241A14' : 'inherit'};">${j.slice(8,10)}/${j.slice(5,7)}</div>
      <div style="font-size:16px; font-weight:700; color:${actif ? '#241A14' : 'var(--accent-dark)'}; margin-top:4px;">${compte[j]}</div>
    </div>
  `;
  }).join('');
}

function selectionnerJour(date) {
  document.getElementById('date-commandes').value = date;
  chargerCommandes();
}

// ---------- COMMANDES À PRÉPARER ----------
async function chargerCommandes() {
  const conteneur = document.getElementById('liste-commandes');
  const aujourdhui = dateLocale();
  const dateChoisie = document.getElementById('date-commandes').value || aujourdhui;
  const afficherTout = document.getElementById('toggle-tout').checked;

  let requete = supabaseClient
    .from('commandes')
    .select('*')
    .eq('date_retrait', dateChoisie)
    .or(`atelier.eq.${atelier},atelier.is.null`)
    .order('heure_retrait', { ascending: true });

  if (!afficherTout) {
    requete = requete.in('statut', ['a_faire', 'annule']);
  }

  const { data, error } = await requete;

  if (error) { conteneur.innerHTML = `<p class="empty">Erreur : ${error.message}</p>`; return; }
  if (!data || data.length === 0) {
    conteneur.innerHTML = `<p class="empty">${afficherTout ? 'Aucune commande pour ce jour.' : 'Tout est prêt ! ✅'}</p>`;
    return;
  }

  const estAujourdhui = dateChoisie === aujourdhui;

  // Regroupe les lignes par client pour n'afficher qu'un seul bloc par personne
  const groupes = {};
  data.forEach(c => {
    if (!groupes[c.client]) groupes[c.client] = [];
    groupes[c.client].push(c);
  });

  conteneur.innerHTML = Object.keys(groupes).map(client => {
    const lignes = groupes[client];
    const tousAnnules = lignes.every(c => c.statut === 'annule');
    const idsAFaire = lignes.filter(c => c.statut === 'a_faire').map(c => c.id);
    const heure = (lignes.find(c => c.heure_retrait) || {}).heure_retrait;
    const notes = [...new Set(lignes.map(c => c.notes).filter(Boolean))].join(' · ');

    const detailProduits = lignes.map(c => `
      <div style="${c.statut === 'annule' ? 'text-decoration:line-through; opacity:.5;' : ''}">
        ${c.produit} (x${c.quantite})${c.statut === 'annule' ? ' <strong style="color:var(--danger);">✕ Annulée</strong>' : ''}
      </div>
    `).join('');

    return `
      <div class="commande" style="${tousAnnules ? 'background:#fdeaea; border-radius:10px; padding:10px; margin-bottom:6px;' : ''}">
        <span>
          <strong>${client}</strong>
          <small>${heure ? 'Retrait ' + heure.slice(0,5) : 'Heure non précisée'}${notes ? ' · ' + notes : ''}</small>
          ${detailProduits}
        </span>
        ${estAujourdhui && idsAFaire.length > 0 ? `
          <button class="small" onclick='marquerPretMultiple(${JSON.stringify(idsAFaire)}, this)'>Marquer prêt</button>` : ''}
      </div>
    `;
  }).join('');
}

function libelleStatutCommande(s) {
  return { a_faire: 'À faire', pret: 'Prêt', annule: 'Annulée' }[s] || s;
}

async function changerStatutCommande(id, statut) {
  const { error } = await supabaseClient.from('commandes').update({ statut }).eq('id', id);
  if (error) alert('Erreur : ' + error.message);
}

async function marquerPret(id, bouton) {
  // Confirmation immédiate à l'écran, avant même la réponse du serveur
  bouton.outerHTML = '<span class="done">✅ Prêt</span>';
  const { error } = await supabaseClient.from('commandes').update({ statut: 'pret' }).eq('id', id);
  if (error) alert('Erreur : ' + error.message);
}

async function marquerPretMultiple(ids, bouton) {
  bouton.outerHTML = '<span class="done">✅ Prêt</span>';
  const { error } = await supabaseClient.from('commandes').update({ statut: 'pret' }).in('id', ids);
  if (error) alert('Erreur : ' + error.message);
}

// ---------- DLC ----------
async function chargerDlc() {
  const conteneur = document.getElementById('liste-dlc');
  const { data, error } = await supabaseClient
    .from('dlc')
    .select('*')
    .eq('ecoule', false)
    .or(`atelier.eq.${atelier},atelier.is.null`)
    .order('dlc', { ascending: true });

  if (error) { conteneur.innerHTML = `<p class="empty">Erreur : ${error.message}</p>`; return; }
  if (!data || data.length === 0) { conteneur.innerHTML = `<p class="empty">Rien à surveiller.</p>`; return; }

  const aujourdhui = new Date(); aujourdhui.setHours(0,0,0,0);

  conteneur.innerHTML = data.map(d => {
    const dateDlc = new Date(d.dlc);
    const joursRestants = Math.round((dateDlc - aujourdhui) / 86400000);
    let etiquette, classe;
    if (joursRestants <= 0) { etiquette = "Expire aujourd'hui"; classe = 'alert'; }
    else if (joursRestants === 1) { etiquette = 'Expire demain'; classe = 'soon'; }
    else { etiquette = `Expire dans ${joursRestants} jours`; classe = ''; }

    return `
      <div class="dlc-item">
        <span>${d.produit}${d.quantite ? ' (' + d.quantite + ')' : ''}</span>
        <span class="${classe}">${etiquette}</span>
      </div>`;
  }).join('');
}

// ---------- Liste des employés pour l'assignation de tâches ----------
async function remplirListeEmployes() {
  const { data } = await supabaseClient.from('employes').select('*').eq('service', atelier).order('nom');
  const select = document.getElementById('assigne-tache');
  if (data) {
    data.forEach(e => {
      const option = document.createElement('option');
      option.value = e.nom;
      option.textContent = e.nom;
      select.appendChild(option);
    });
  }
}

// ---------- MESSAGE DU JOUR (boutique -> labo) ----------
async function verifierMessageDuJour() {
  const { data, error } = await supabaseClient
    .from('messages_jour')
    .select('*')
    .eq('atelier', atelier)
    .eq('vu', false)
    .order('created_at', { ascending: true });

  if (error || !data || data.length === 0) return;

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(36,26,20,.6);display:flex;align-items:center;justify-content:center;z-index:9998;padding:20px;';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:18px;padding:24px;max-width:380px;width:100%;">
      <h2 style="font-family:'Fraunces',serif;margin-top:0;">💬 Message de la boutique</h2>
      ${data.map(m => `
        <p style="margin:14px 0; padding-bottom:14px; border-bottom:1px solid #eee;">
          ${m.message}${m.auteur ? '<br><small style="opacity:.6;">— ' + m.auteur + '</small>' : ''}
        </p>`).join('')}
      <button class="primary" id="btn-fermer-message" style="margin-top:0;">J'ai vu, merci</button>
    </div>`;
  document.body.appendChild(overlay);

  document.getElementById('btn-fermer-message').onclick = async () => {
    const ids = data.map(m => m.id);
    await supabaseClient.from('messages_jour').update({ vu: true }).in('id', ids);
    overlay.remove();
  };
}

function chargerTout() {
  chargerTaches();
  chargerCommandes();
  chargerDlc();
  chargerVueSemaine();
}

// ---------- RAPPEL RELEVÉ DE TEMPÉRATURES ----------
const RAPPELS_TEMPERATURE = [
  { heure: '05:10', moment: 'matin', libelle: 'du matin' },
  { heure: '11:00', moment: 'midi', libelle: 'du midi' },
  { heure: '18:00', moment: 'soir', libelle: 'du soir' }
];

async function verifierRappelTemperature() {
  const maintenant = new Date();
  const heureActuelle = String(maintenant.getHours()).padStart(2, '0') + ':' + String(maintenant.getMinutes()).padStart(2, '0');
  const aujourdhui = dateLocale();

  const rappelsDus = RAPPELS_TEMPERATURE.filter(r => heureActuelle >= r.heure);
  if (rappelsDus.length === 0) return;

  const { data } = await supabaseClient
    .from('temperatures')
    .select('moment')
    .eq('atelier', atelier)
    .eq('date_releve', aujourdhui);

  const momentsFaits = new Set((data || []).map(t => t.moment));
  const manquants = rappelsDus.filter(r => !momentsFaits.has(r.moment));

  if (manquants.length === 0) return;

  const cleSession = 'rappel_temp_vu_' + aujourdhui + '_' + manquants.map(m => m.moment).join('-');
  if (sessionStorage.getItem(cleSession)) return;
  sessionStorage.setItem(cleSession, '1');

  afficherRappelTemperature(manquants);
}

function afficherRappelTemperature(manquants) {
  const ancien = document.getElementById('overlay-rappel-temperature');
  if (ancien) ancien.remove();

  const overlay = document.createElement('div');
  overlay.id = 'overlay-rappel-temperature';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(36,26,20,.7);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;';
  overlay.innerHTML = `
    <div style="background:#fff;border-radius:18px;padding:28px;max-width:340px;width:100%;text-align:center;">
      <div style="font-size:40px;margin-bottom:10px;">🌡️</div>
      <h2 style="font-family:'Fraunces',serif;margin:0 0 10px;">Rappel température</h2>
      <p style="opacity:.8;margin:0 0 20px;">Relevé${manquants.length > 1 ? 's' : ''} pas encore fait${manquants.length > 1 ? 's' : ''} : ${manquants.map(m => m.libelle).join(', ')}.</p>
      <a href="temperatures.html?atelier=${atelier}" style="display:block;text-decoration:none;background:var(--accent);color:#241A14;padding:14px;border-radius:12px;font-weight:600;margin-bottom:8px;">Aller au relevé</a>
      <button onclick="document.getElementById('overlay-rappel-temperature').remove()" style="width:100%;border:none;background:none;color:#999;padding:10px;">Plus tard</button>
    </div>`;
  document.body.appendChild(overlay);
}

initProfil((profil) => {
  window.profilActuel = profil;
  document.getElementById('date-commandes').value = dateLocale();
  verifierMessageDuJour();
  verifierRappelTemperature();
  setInterval(verifierRappelTemperature, 5 * 60 * 1000);

  // Seul le chef peut créer et assigner des tâches
  if (profil.role !== 'chef') {
    document.getElementById('card-ajout-tache').style.display = 'none';
  } else {
    remplirListeEmployes();
    chargerRaccourcisTaches();
  }

  chargerTout();

  supabaseClient
    .channel('labo-' + atelier)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'taches' }, chargerTaches)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'commandes' }, chargerCommandes)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'dlc' }, chargerDlc)
    .subscribe();
}, atelier);
