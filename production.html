<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production du jour — Boulangerie Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FAF7F2; --surface:#FFFFFF; --ink:#241A14;
    --accent:#C68A2E; --accent-dark:#9C6B1E; --radius:18px;
  }
  *{box-sizing:border-box;}
  body{font-family:'Inter',Arial,sans-serif; margin:0; background:var(--bg); color:var(--ink);}
  header{background:var(--ink); color:#fff; padding:22px 20px; display:flex; align-items:center; justify-content:space-between;}
  header h1{margin:0; font-family:'Fraunces',serif; font-size:22px;}
  header a{color:#fff; opacity:.7; text-decoration:none; font-size:13px;}
  main{padding:20px; max-width:700px; margin:auto;}
  .card{background:var(--surface); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .card h2{margin-top:0; font-family:'Fraunces',serif; font-size:19px;}
  .date-jour{font-size:14px; opacity:.6; margin:-8px 0 16px;}
  .ligne-produit{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .ligne-produit span{flex:1;}
  .ligne-produit input{width:90px; text-align:center; padding:12px; border-radius:10px; border:1px solid #ddd; font-size:15px;}
  button.primary{
    margin-top:10px; width:100%; border:none; background:var(--accent); color:#241A14;
    padding:14px; border-radius:12px; font-size:16px; font-weight:600;
  }
  button.secondaire{
    margin-top:10px; width:100%; border:1px solid #ddd; background:#fff; color:var(--ink);
    padding:14px; border-radius:12px; font-size:15px; font-weight:600;
  }
  button.primary:active, button.secondaire:active{transform:scale(0.98);}
  .document{border:1px solid #eee; border-radius:12px; padding:18px; margin-top:16px;}
  .document h3{font-family:'Fraunces',serif; margin:0 0 4px;}
  .document .ligne-doc{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #f0ebe3; font-size:14px;}
  .document .ligne-doc:last-child{border-bottom:none;}
</style>
</head>
<body>

<header style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
  <a href="index.html" title="Accueil" style="display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; width:52px; height:52px; border-radius:50%; background:var(--accent); color:#241A14; text-decoration:none; font-size:24px;">🏠</a>
  <h1 style="margin:0; text-align:center; flex:1;">🏭 Production du jour</h1>
  <div style="display:flex; flex-direction:column; align-items:center; flex-shrink:0;">
    <button onclick="effacerProfil()" title="Changer de profil" style="width:52px; height:52px; border-radius:50%; border:none; background:var(--accent); color:#241A14; font-size:26px; cursor:pointer; padding:0;">👨‍🍳</button>
    <span id="bandeau-profil" style="font-size:10px; opacity:.8; margin-top:3px; text-align:center;"></span>
  </div>
</header>

<main>
  <div class="card">
    <h2>Quantités</h2>
    <label>Jour</label>
    <input id="date-production" type="date" onchange="changerJourProduction()">
    <div id="liste-produits-production" style="margin-top:14px;"></div>
    <button class="primary" onclick="enregistrerProduction()">Enregistrer</button>
    <button class="secondaire" onclick="basculerDocument()">📄 Voir le document</button>
    <button class="secondaire" onclick="telechargerProductionCSV()">⬇️ Télécharger ce jour</button>
    <button class="secondaire" onclick="telechargerHistoriqueAnnuel()">⬇️ Télécharger l'historique (1 an)</button>
    <div class="document" id="document-production" style="display:none;"></div>
  </div>
</main>

<script src="supabase-config.js?v=6"></script>
<script src="profil.js?v=7"></script>
<script>

const PRODUITS_BOULANGERIE = [
  { nom: 'Baguettes', unite: 'pièce' },
  { nom: 'Tradition', unite: 'pièce' },
  { nom: 'Graines', unite: 'pièce' },
  { nom: 'Héritage', unite: 'pièce' },
  { nom: 'Bûcheron', unite: 'kg' },
  { nom: 'Viennoise', unite: 'kg' },
  { nom: 'Complet', unite: 'kg' },
  { nom: 'Viking', unite: 'kg' },
  { nom: 'Seigle', unite: 'kg' },
  { nom: 'Triple alliance', unite: 'kg' },
  { nom: "Pavé d'avoine", unite: 'kg' },
  { nom: 'Pain marin', unite: 'kg' },
  { nom: "Brique d'épeautre", unite: 'kg' },
  { nom: 'Pains au maïs', unite: 'kg' }
];

function afficherFormulaireProduction() {
  document.getElementById('liste-produits-production').innerHTML = PRODUITS_BOULANGERIE.map(p => `
    <div class="ligne-produit">
      <span>${p.nom} <small style="opacity:.5;">(${p.unite})</small></span>
      <input type="number" min="0" step="${p.unite === 'kg' ? '0.1' : '1'}" id="prod-${p.nom.replace(/\s+/g, '_')}" placeholder="0">
    </div>
  `).join('');
}

function jourSelectionneProduction() {
  return document.getElementById('date-production').value || dateLocale();
}

async function obtenirTotalDuJour(dateVoulue) {
  const date = dateVoulue || jourSelectionneProduction();
  const { data, error } = await supabaseClient
    .from('production_jour')
    .select('*')
    .eq('date_production', date)
    .eq('atelier', 'boulangerie');

  const totaux = {};
  PRODUITS_BOULANGERIE.forEach(p => totaux[p.nom] = 0);
  if (error || !data) return totaux;

  data.forEach(l => { totaux[l.produit] = parseFloat(l.quantite); });
  return totaux;
}

// Recharge les champs avec les valeurs déjà enregistrées pour le jour choisi
async function changerJourProduction() {
  const totaux = await obtenirTotalDuJour();
  PRODUITS_BOULANGERIE.forEach(p => {
    const input = document.getElementById('prod-' + p.nom.replace(/\s+/g, '_'));
    if (input) input.value = totaux[p.nom] > 0 ? totaux[p.nom] : '';
  });

  const zoneDoc = document.getElementById('document-production');
  if (zoneDoc.style.display === 'block') afficherDocument();
}

async function enregistrerProduction() {
  const date = jourSelectionneProduction();
  const enregistre_par = window.profilActuel ? window.profilActuel.nom : null;

  const lignes = PRODUITS_BOULANGERIE.map(p => {
    const input = document.getElementById('prod-' + p.nom.replace(/\s+/g, '_'));
    return { produit: p.nom, unite: p.unite, quantite: parseFloat(input.value) || 0, date_production: date, atelier: 'boulangerie', enregistre_par };
  });

  const { error } = await supabaseClient
    .from('production_jour')
    .upsert(lignes, { onConflict: 'produit,atelier,date_production' });

  if (error) { alert('Erreur : ' + error.message); return; }

  alert('Production enregistrée pour le ' + date.split('-').reverse().join('/') + '.');

  const zoneDoc = document.getElementById('document-production');
  if (zoneDoc.style.display === 'block') afficherDocument();
}

async function basculerDocument() {
  const zone = document.getElementById('document-production');
  if (zone.style.display === 'block') { zone.style.display = 'none'; return; }
  await afficherDocument();
  zone.style.display = 'block';
}

async function afficherDocument() {
  const zone = document.getElementById('document-production');
  const date = jourSelectionneProduction();
  const totaux = await obtenirTotalDuJour(date);

  const lignesDoc = PRODUITS_BOULANGERIE.map(p => `
    <div class="ligne-doc"><span>${p.nom}</span><strong>${totaux[p.nom]} ${p.unite}</strong></div>
  `).join('');

  zone.innerHTML = `
    <h3>Production du ${date.split('-').reverse().join('/')}</h3>
    <p style="opacity:.6; font-size:13px; margin-top:0;">Boulangerie</p>
    ${lignesDoc}
  `;
}

function telechargerProductionCSV() {
  const date = jourSelectionneProduction();
  const lignes = [['Date', 'Produit', 'Quantité', 'Unité']];

  PRODUITS_BOULANGERIE.forEach(p => {
    const input = document.getElementById('prod-' + p.nom.replace(/\s+/g, '_'));
    const quantite = parseFloat(input.value) || 0;
    lignes.push([date.split('-').reverse().join('/'), p.nom, quantite, p.unite]);
  });

  const csv = lignes.map(l => l.map(champ => `"${String(champ).replace(/"/g, '""')}"`).join(';')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const lien = document.createElement('a');
  lien.href = url;
  lien.download = 'production_boulangerie_' + date + '.csv';
  document.body.appendChild(lien);
  lien.click();
  document.body.removeChild(lien);
  URL.revokeObjectURL(url);
}

async function telechargerHistoriqueAnnuel() {
  const dansUnAn = new Date();
  dansUnAn.setFullYear(dansUnAn.getFullYear() - 1);
  const dateLimite = dateLocale(dansUnAn);

  const { data, error } = await supabaseClient
    .from('production_jour')
    .select('*')
    .eq('atelier', 'boulangerie')
    .gte('date_production', dateLimite)
    .order('date_production', { ascending: true });

  if (error) { alert('Erreur : ' + error.message); return; }
  if (!data || data.length === 0) { alert('Aucune donnée sur les 12 derniers mois.'); return; }

  const lignes = [['Date', 'Produit', 'Quantité', 'Unité', 'Enregistré par']];
  data.forEach(l => {
    lignes.push([l.date_production.split('-').reverse().join('/'), l.produit, l.quantite, l.unite || '', l.enregistre_par || '']);
  });

  const csv = lignes.map(l => l.map(champ => `"${String(champ).replace(/"/g, '""')}"`).join(';')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const lien = document.createElement('a');
  lien.href = url;
  lien.download = 'historique_production_boulangerie_1an.csv';
  document.body.appendChild(lien);
  lien.click();
  document.body.removeChild(lien);
  URL.revokeObjectURL(url);
}

window.INACTIVITE_RETOUR_ACCUEIL = true;

initProfil((profil) => {
  window.profilActuel = profil;
  document.getElementById('date-production').value = dateLocale();
  afficherFormulaireProduction();
  changerJourProduction();
});

</script>
</body>
</html>
