<!DOCTYPE html>
<html lang="fr">
<head>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Production du jour — Boulangerie Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FAF7F2; --surface:#FFFFFF; --ink:#241A14;
    --accent:#C68A2E; --accent-dark:#9C6B1E; --radius:18px;
  }
  *{box-sizing:border-box;}
  body{font-family:'Inter',Arial,sans-serif; margin:0; background:var(--bg); color:var(--ink);}
  header{background:var(--ink); color:#fff; padding:22px 20px; display:flex; align-items:center; justify-content:space-between;}
  header h1{margin:0; font-family:'Fraunces',serif; font-size:22px;}
  header a{color:#fff; opacity:.7; text-decoration:none; font-size:13px;}
  main{padding:20px; max-width:700px; margin:auto;}
  .card{background:var(--surface); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .card h2{margin-top:0; font-family:'Fraunces',serif; font-size:19px;}
  .date-jour{font-size:14px; opacity:.6; margin:-8px 0 16px;}
  .ligne-produit{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .ligne-produit span{flex:1;}
  .ligne-produit input{width:90px; text-align:center; padding:12px; border-radius:10px; border:1px solid #ddd; font-size:15px;}
  button.primary{
    margin-top:10px; width:100%; border:none; background:var(--accent); color:#241A14;
    padding:14px; border-radius:12px; font-size:16px; font-weight:600;
  }
  button.secondaire{
    margin-top:10px; width:100%; border:1px solid #ddd; background:#fff; color:var(--ink);
    padding:14px; border-radius:12px; font-size:15px; font-weight:600;
  }
  button.primary:active, button.secondaire:active{transform:scale(0.98);}
  .onglets{display:flex; gap:8px; overflow-x:auto; padding:4px 0 10px;}
  .onglet{flex:0 0 auto; border:1px solid #ddd; background:#fff; color:var(--ink); padding:10px 14px; border-radius:20px; font-size:14px; font-weight:600; cursor:pointer;}
  .onglet.actif{background:var(--ink); color:#fff; border-color:var(--ink);}
  .jour-histo{padding:8px 0; border-bottom:1px solid #f0ebe3; font-size:14px;}
  .jour-histo:last-child{border-bottom:none;}
  .jour-histo b{display:block; margin-bottom:2px;}
  .document{border:1px solid #eee; border-radius:12px; padding:18px; margin-top:16px;}
  .document h3{font-family:'Fraunces',serif; margin:0 0 4px;}
  .document .ligne-doc{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #f0ebe3; font-size:14px;}
  .document .ligne-doc:last-child{border-bottom:none;}
  #contenu-cuit-reel .ligne-doc{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #f0ebe3; font-size:16px;}
</style>
<link rel="stylesheet" href="responsive.css?v=1">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icone-192.png">
</head>
<body>

<header style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
  <a href="index.html" title="Accueil" style="display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; width:52px; height:52px; border-radius:50%; background:var(--accent); color:#241A14; text-decoration:none; font-size:24px;">🏠</a>
  <h1 style="margin:0; text-align:center; flex:1;">🏭 Production du jour</h1>
  <div style="display:flex; flex-direction:column; align-items:center; flex-shrink:0;">
    <button onclick="effacerProfil()" title="Changer de profil" style="width:52px; height:52px; border-radius:50%; border:none; background:var(--accent); color:#241A14; font-size:26px; cursor:pointer; padding:0;">👨‍🍳</button>
    <span id="bandeau-profil" style="font-size:10px; opacity:.8; margin-top:3px; text-align:center;"></span>
  </div>
</header>

<main>
  <div class="card" id="card-cuit-reel" style="display:none;">
    <h2>🔥 Tradition réellement cuite <small id="date-cuit-reel" style="font-weight:400;opacity:.6;font-size:14px;"></small></h2>
    <div id="contenu-cuit-reel"></div>
  </div>
  <div class="card">
    <h2>Quantités</h2>
    <label>Jour</label>
    <input id="date-production" type="date" onchange="changerJourProduction()">
    <button class="secondaire" onclick="chargerValeursExistantes()" style="margin-top:10px;">✏️ Modifier les données déjà enregistrées</button>
    <div id="liste-produits-production" style="margin-top:14px;"></div>
    <button class="primary" onclick="enregistrerProduction()">Enregistrer</button>
    <button class="secondaire" onclick="basculerDocument()">📄 Voir le document</button>
    <button class="secondaire" onclick="basculerTotalMois()">📊 Voir le total du mois</button>
    <button class="secondaire" onclick="telechargerProductionMois()">⬇️ Télécharger le mois</button>
    <button class="secondaire" onclick="basculerHistoriqueAnnee()">📅 Voir l'historique de l'année</button>
    <button class="secondaire" onclick="telechargerHistoriqueAnnuel()">⬇️ Télécharger l'historique (1 an)</button>
    <div class="document" id="document-production" style="display:none;"></div>
    <div class="document" id="total-mois-production" style="display:none;"></div>
    <div class="document" id="historique-annee" style="display:none;"></div>
  </div>
</main>

<script src="supabase-config.js?v=6"></script>
<script src="profil.js?v=10"></script>
<script>

const PRODUITS_BOULANGERIE = [
  { nom: 'Baguettes', unite: 'pièce' },
  { nom: 'Tradition', unite: 'pièce' },
  { nom: 'Graines', unite: 'pièce' },
  { nom: 'Héritage', unite: 'pièce' },
  { nom: 'Bûcheron', unite: 'kg' },
  { nom: 'Viennoise', unite: 'kg' },
  { nom: 'Complet', unite: 'kg' },
  { nom: 'Viking', unite: 'kg' },
  { nom: 'Seigle', unite: 'kg' },
  { nom: 'Triple alliance', unite: 'kg' },
  { nom: "Pavé d'avoine", unite: 'kg' },
  { nom: 'Pain marin', unite: 'kg' },
  { nom: "Brique d'épeautre", unite: 'kg' },
  { nom: 'Pains au maïs', unite: 'kg' }
];

function afficherFormulaireProduction() {
  document.getElementById('liste-produits-production').innerHTML = PRODUITS_BOULANGERIE.map(p => `
    <div class="ligne-produit">
      <span>${p.nom}${p.nom === 'Tradition' ? ' <b>(matin)</b>' : ''} <small style="opacity:.5;">(${p.unite})</small></span>
      <input type="number" min="0" step="${p.unite === 'kg' ? '0.1' : '1'}" id="prod-${p.nom.replace(/\s+/g, '_')}" placeholder="0">
    </div>
  `).join('');
}

function jourSelectionneProduction() {
  return document.getElementById('date-production').value || dateLocale();
}

async function obtenirTotalDuJour(dateVoulue) {
  const date = dateVoulue || jourSelectionneProduction();
  const { data, error } = await supabaseClient
    .from('production_jour')
    .select('*')
    .eq('date_production', date)
    .eq('atelier', 'boulangerie');

  const totaux = {};
  PRODUITS_BOULANGERIE.forEach(p => totaux[p.nom] = 0);
  if (error || !data) return totaux;

  data.forEach(l => { totaux[l.produit] = parseFloat(l.quantite); });
  return totaux;
}

// Changer de jour repart sur des champs vides (saisie rapide d'un nouveau jour)
function changerJourProduction() {
  PRODUITS_BOULANGERIE.forEach(p => {
    const input = document.getElementById('prod-' + p.nom.replace(/\s+/g, '_'));
    if (input) input.value = '';
  });

  const zoneDoc = document.getElementById('document-production');
  if (zoneDoc.style.display === 'block') afficherDocument();
}

// Charge les valeurs déjà enregistrées pour corriger une erreur
async function chargerValeursExistantes() {
  const totaux = await obtenirTotalDuJour();
  PRODUITS_BOULANGERIE.forEach(p => {
    const input = document.getElementById('prod-' + p.nom.replace(/\s+/g, '_'));
    if (input) input.value = totaux[p.nom] > 0 ? totaux[p.nom] : '';
  });
}

async function enregistrerProduction() {
  const date = jourSelectionneProduction();
  const enregistre_par = window.profilActuel ? window.profilActuel.nom : null;

  const lignes = PRODUITS_BOULANGERIE.map(p => {
    const input = document.getElementById('prod-' + p.nom.replace(/\s+/g, '_'));
    return { produit: p.nom, unite: p.unite, quantite: parseFloat(input.value) || 0, date_production: date, atelier: 'boulangerie', enregistre_par };
  });

  const { error } = await supabaseClient
    .from('production_jour')
    .upsert(lignes, { onConflict: 'produit,atelier,date_production' });

  if (error) { alert('Erreur : ' + error.message); return; }

  alert('Production enregistrée pour le ' + date.split('-').reverse().join('/') + '.');

  const zoneDoc = document.getElementById('document-production');
  if (zoneDoc.style.display === 'block') afficherDocument();
}

async function basculerDocument() {
  const zone = document.getElementById('document-production');
  if (zone.style.display === 'block') { zone.style.display = 'none'; return; }
  await afficherDocument();
  zone.style.display = 'block';
}

async function afficherDocument() {
  const zone = document.getElementById('document-production');
  const date = jourSelectionneProduction();
  const totaux = await obtenirTotalDuJour(date);

  const lignesDoc = PRODUITS_BOULANGERIE.map(p => `
    <div class="ligne-doc"><span>${p.nom}</span><strong>${totaux[p.nom]} ${p.unite}</strong></div>
  `).join('');

  zone.innerHTML = `
    <h3>Production du ${date.split('-').reverse().join('/')}</h3>
    <p style="opacity:.6; font-size:13px; margin-top:0;">Boulangerie</p>
    ${lignesDoc}
  `;
}

async function obtenirTotalDuMois(date) {
  const [an, mois] = date.split('-');
  const premierJour = `${an}-${mois}-01`;
  const dernierJourNum = new Date(parseInt(an), parseInt(mois), 0).getDate();
  const dernierJour = `${an}-${mois}-${String(dernierJourNum).padStart(2, '0')}`;

  const { data, error } = await supabaseClient
    .from('production_jour')
    .select('*')
    .eq('atelier', 'boulangerie')
    .gte('date_production', premierJour)
    .lte('date_production', dernierJour);

  if (error) return { erreur: error.message };

  const totaux = {};
  (data || []).forEach(l => { totaux[l.produit] = (totaux[l.produit] || 0) + parseFloat(l.quantite); });

  return { totaux, an, mois };
}

async function basculerTotalMois() {
  const zone = document.getElementById('total-mois-production');
  if (zone.style.display === 'block') { zone.style.display = 'none'; return; }

  const date = jourSelectionneProduction();
  const resultat = await obtenirTotalDuMois(date);

  if (resultat.erreur) { zone.innerHTML = `<p>Erreur : ${resultat.erreur}</p>`; zone.style.display = 'block'; return; }

  const lignesDoc = PRODUITS_BOULANGERIE
    .filter(p => resultat.totaux[p.nom])
    .map(p => `<div class="ligne-doc"><span>${p.nom}</span><strong>${resultat.totaux[p.nom]} ${p.unite}</strong></div>`)
    .join('');

  zone.innerHTML = `
    <h3>Total du mois — ${resultat.mois}/${resultat.an}</h3>
    <p style="opacity:.6; font-size:13px; margin-top:0;">Boulangerie</p>
    ${lignesDoc || '<p style="opacity:.5;">Aucune donnée pour ce mois.</p>'}
  `;
  zone.style.display = 'block';
}

async function telechargerProductionMois() {
  const date = jourSelectionneProduction();
  const { totaux, an, mois, erreur } = await obtenirTotalDuMois(date);

  if (erreur) { alert('Erreur : ' + erreur); return; }
  if (!totaux || Object.keys(totaux).length === 0) { alert('Aucune donnée pour ce mois.'); return; }

  const lignes = [['Mois', mois + '/' + an], ['']];
  lignes.push(['Produit', 'Quantité totale', 'Unité']);
  PRODUITS_BOULANGERIE.forEach(p => {
    if (totaux[p.nom]) lignes.push([p.nom, totaux[p.nom], p.unite]);
  });

  const csv = lignes.map(l => l.map(champ => `"${String(champ).replace(/"/g, '""')}"`).join(';')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const lien = document.createElement('a');
  lien.href = url;
  lien.download = 'production_boulangerie_' + an + '-' + mois + '.csv';
  document.body.appendChild(lien);
  lien.click();
  document.body.removeChild(lien);
  URL.revokeObjectURL(url);
}


// ---------- Historique de l'année à l'écran ----------
let historiqueAnnee = [];
let moisHistoriqueChoisi = null;

async function chargerLignesAnnee() {
  const dansUnAn = new Date();
  dansUnAn.setFullYear(dansUnAn.getFullYear() - 1);
  const dateLimite = dateLocale(dansUnAn);
  let toutes = [];
  for (let debut = 0; ; debut += 1000) {
    const { data, error } = await supabaseClient.from('production_jour').select('*')
      .eq('atelier', 'boulangerie').gte('date_production', dateLimite)
      .order('date_production', { ascending: true }).range(debut, debut + 999);
    if (error) return { erreur: error.message };
    toutes = toutes.concat(data || []);
    if (!data || data.length < 1000) break;
  }
  return { lignes: toutes };
}

function ordreProduits(noms) {
  const connus = PRODUITS_BOULANGERIE.map(p => p.nom);
  return noms.slice().sort((a, b) => {
    const ia = connus.indexOf(a), ib = connus.indexOf(b);
    return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib) || a.localeCompare(b);
  });
}

function formaterNombre(n) {
  return (Math.round(n * 10) / 10).toLocaleString('fr-FR');
}

async function basculerHistoriqueAnnee() {
  const zone = document.getElementById('historique-annee');
  if (zone.style.display === 'block') { zone.style.display = 'none'; return; }
  zone.style.display = 'block';
  zone.innerHTML = '<p style="opacity:.6;margin:0;">Chargement...</p>';
  const r = await chargerLignesAnnee();
  if (r.erreur) { zone.innerHTML = '<p>Erreur : ' + r.erreur + '</p>'; return; }
  historiqueAnnee = r.lignes.filter(l => parseFloat(l.quantite) > 0);
  if (historiqueAnnee.length === 0) { zone.innerHTML = '<p style="margin:0;">Aucune donnée sur les 12 derniers mois.</p>'; return; }
  const mois = [...new Set(historiqueAnnee.map(l => l.date_production.slice(0, 7)))].sort().reverse();
  moisHistoriqueChoisi = mois[0];
  dessinerHistoriqueAnnee();
}

function choisirMoisHistorique(m) {
  moisHistoriqueChoisi = m;
  dessinerHistoriqueAnnee();
}

function dessinerHistoriqueAnnee() {
  const zone = document.getElementById('historique-annee');
  const mois = [...new Set(historiqueAnnee.map(l => l.date_production.slice(0, 7)))].sort().reverse();

  // 1) Total de chaque produit sur 1 an
  const totalAn = {};
  historiqueAnnee.forEach(l => { totalAn[l.produit] = (totalAn[l.produit] || 0) + parseFloat(l.quantite); });
  const lignesAn = ordreProduits(Object.keys(totalAn)).map(n =>
    `<div class="ligne-doc"><span>${n}</span><strong>${formaterNombre(totalAn[n])}</strong></div>`).join('');

  // 2) Onglets des mois
  const nomMois = (m) => {
    const [an, mo] = m.split('-').map(Number);
    const t = new Date(an, mo - 1, 1).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
    return t.charAt(0).toUpperCase() + t.slice(1);
  };
  const onglets = mois.map(m =>
    `<button class="onglet ${m === moisHistoriqueChoisi ? 'actif' : ''}" onclick="choisirMoisHistorique('${m}')">${nomMois(m)}</button>`).join('');

  // 3) Total du mois choisi + jours saisis seulement
  const duMois = historiqueAnnee.filter(l => l.date_production.startsWith(moisHistoriqueChoisi));
  const totalMois = {};
  duMois.forEach(l => { totalMois[l.produit] = (totalMois[l.produit] || 0) + parseFloat(l.quantite); });
  const lignesMois = ordreProduits(Object.keys(totalMois)).map(n =>
    `<div class="ligne-doc"><span>${n}</span><strong>${formaterNombre(totalMois[n])}</strong></div>`).join('');

  const parJour = {};
  duMois.forEach(l => { (parJour[l.date_production] = parJour[l.date_production] || {})[l.produit] = parseFloat(l.quantite); });
  const jours = Object.keys(parJour).sort().reverse().map(d => {
    const [an, mo, jo] = d.split('-').map(Number);
    const titre = new Date(an, mo - 1, jo).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
    const detail = ordreProduits(Object.keys(parJour[d])).map(n => `${n} ${formaterNombre(parJour[d][n])}`).join(' · ');
    return `<div class="jour-histo"><b>${titre}</b>${detail}</div>`;
  }).join('');

  zone.innerHTML = `
    <h3>📊 Total sur 1 an</h3>
    ${lignesAn}
    <h3 style="margin-top:22px;">📅 Par mois</h3>
    <div class="onglets">${onglets}</div>
    <div style="margin-bottom:14px;">${lignesMois}</div>
    <h3>🗓️ Jour par jour <small style="font-weight:400;opacity:.6;">(jours saisis seulement)</small></h3>
    ${jours}`;
}

async function telechargerHistoriqueAnnuel() {
  const r = await chargerLignesAnnee();
  if (r.erreur) { alert('Erreur : ' + r.erreur); return; }
  const data = r.lignes;
  if (!data || data.length === 0) { alert('Aucune donnée sur les 12 derniers mois.'); return; }

  const lignes = [['Date', 'Produit', 'Quantité', 'Unité', 'Enregistré par']];
  data.forEach(l => {
    lignes.push([l.date_production.split('-').reverse().join('/'), l.produit, l.quantite, l.unite || '', l.enregistre_par || '']);
  });

  const csv = lignes.map(l => l.map(champ => `"${String(champ).replace(/"/g, '""')}"`).join(';')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const lien = document.createElement('a');
  lien.href = url;
  lien.download = 'historique_production_boulangerie_1an.csv';
  document.body.appendChild(lien);
  lien.click();
  document.body.removeChild(lien);
  URL.revokeObjectURL(url);
}

window.INACTIVITE_RETOUR_ACCUEIL = true;

async function afficherCuitReel() {
  const d = new Date(); d.setDate(d.getDate() - 7);
  const date = dateLocale(d);
  document.getElementById('card-cuit-reel').style.display = 'block';
  document.getElementById('date-cuit-reel').textContent = '(il y a 7 jours : ' + d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }) + ')';
  const noms = ['Tradition', 'Tradition après-midi', 'Tradition pas cuite', 'Tradition pas cuite après-midi'];
  const { data, error } = await supabaseClient.from('production_jour').select('produit, quantite')
    .eq('atelier', 'boulangerie').eq('date_production', date).in('produit', noms);
  const zone = document.getElementById('contenu-cuit-reel');
  if (error) { zone.textContent = 'Erreur : ' + error.message; return; }
  const lu = {};
  (data || []).forEach(l => { lu[l.produit] = parseFloat(l.quantite) || 0; });
  if (lu['Tradition'] === undefined && lu['Tradition après-midi'] === undefined) { zone.innerHTML = '<p style="opacity:.6;margin:0;">Pas de production Tradition enregistrée ce jour-là.</p>'; return; }
  const matin = lu['Tradition'] || 0, apm = lu['Tradition après-midi'] || 0;
  const pcM = lu['Tradition pas cuite'] || 0, pcA = lu['Tradition pas cuite après-midi'] || 0;
  const total = matin + apm - pcM - pcA;
  zone.innerHTML = `
    <p style="font-size:42px;font-weight:700;margin:0;font-family:'Fraunces',serif;">${total} <small style="font-size:16px;font-weight:400;opacity:.6;">traditions cuites</small></p>
    <p style="font-size:12px;opacity:.5;margin:6px 0 0;">${matin} matin + ${apm} aprem − ${pcM + pcA} pas cuites</p>`;
}

initProfil((profil) => {
  window.profilActuel = profil;
  if (profil.role === 'chef') afficherCuitReel();
  document.getElementById('date-production').value = dateLocale();
  afficherFormulaireProduction();
  changerJourProduction();
});

</script>
</body>
</html>
