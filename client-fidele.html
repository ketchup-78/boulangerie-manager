<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casino Shop — Boulangerie Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FAF7F2; --surface:#FFFFFF; --ink:#241A14;
    --accent:#C68A2E; --accent-dark:#9C6B1E; --radius:18px;
  }
  *{box-sizing:border-box;}
  body{font-family:'Inter',Arial,sans-serif; margin:0; background:var(--bg); color:var(--ink);}
  header{background:var(--ink); color:#fff; padding:22px 20px; display:flex; align-items:center; justify-content:space-between;}
  header h1{margin:0; font-family:'Fraunces',serif; font-size:22px;}
  header a{color:#fff; opacity:.7; text-decoration:none; font-size:13px;}
  main{padding:20px; max-width:700px; margin:auto;}
  .card{background:var(--surface); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .card h2{margin-top:0; font-family:'Fraunces',serif; font-size:19px;}
  label{display:block; font-size:13px; opacity:.7; margin:10px 0 4px;}
  input, select, textarea{width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; font-size:15px; font-family:inherit;}
  textarea{min-height:80px; resize:vertical;}
  button.primary{
    margin-top:16px; width:100%; border:none; background:var(--accent); color:#241A14;
    padding:14px; border-radius:12px; font-size:16px; font-weight:600;
  }
  button.primary:active{transform:scale(0.98);}
  .ligne-produit{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .ligne-produit span{flex:1;}
  .ligne-produit input{width:80px; text-align:center;}
  .lien-historique{width:100%; border:none; background:none; color:var(--accent-dark); font-size:14px; margin-top:10px; text-decoration:underline; cursor:pointer; padding:0; text-align:left;}
  .empty{opacity:.5; font-size:14px; padding:10px 0;}
</style>
</head>
<body>

<header style="display:flex; align-items:center; justify-content:space-between; gap:10px;">
  <a href="index.html" title="Accueil" style="display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; width:52px; height:52px; border-radius:50%; background:var(--accent); color:#241A14; text-decoration:none; font-size:24px;">🏠</a>
  <h1 id="titre-page" style="margin:0; text-align:center; flex:1;">🏪 Casino Shop</h1>
  <div style="display:flex; flex-direction:column; align-items:center; flex-shrink:0;">
    <button onclick="effacerProfil()" title="Changer de profil" style="width:52px; height:52px; border-radius:50%; border:none; background:var(--accent); color:#241A14; font-size:26px; cursor:pointer; padding:0;">👨‍🍳</button>
    <span id="bandeau-profil" style="font-size:10px; opacity:.8; margin-top:3px; text-align:center;"></span>
  </div>
</header>

<main id="zone-clients">
  <div id="liste-clients-reguliers"></div>
</main>

<script src="supabase-config.js?v=5"></script>
<script src="profil.js?v=5"></script>
<script>

const paramsPage = new URLSearchParams(window.location.search);
const atelierFiltre = paramsPage.get('atelier');

const TITRES_PAGE = {
  boulangerie: '🏪 Casino Shop',
  vente: '🐭 Clients réguliers',
  patisserie: '👤 Clients réguliers'
};
if (atelierFiltre && TITRES_PAGE[atelierFiltre]) {
  document.getElementById('titre-page').textContent = TITRES_PAGE[atelierFiltre];
}

async function chargerClientsReguliers() {
  const conteneur = document.getElementById('liste-clients-reguliers');
  let requete = supabaseClient.from('clients_reguliers').select('*').order('nom');
  if (atelierFiltre) requete = requete.eq('atelier', atelierFiltre);
  const { data: clients, error } = await requete;

  if (error) { conteneur.innerHTML = `<p class="empty">Erreur : ${error.message}</p>`; return; }
  if (!clients || clients.length === 0) { conteneur.innerHTML = ''; return; }

  conteneur.innerHTML = '';

  for (const client of clients) {
    const emoji = client.atelier === 'patisserie' ? '🧁' : (client.atelier === 'vente' ? '🛎️' : '🍞');
    const accesInterdit = client.reserve_chef && (!window.profilActuel || window.profilActuel.role !== 'chef');

    const carte = document.createElement('div');
    carte.className = 'card';

    if (accesInterdit) {
      carte.innerHTML = `<h2>${emoji} ${client.nom}</h2><p class="empty">Réservé au chef.</p>`;
      conteneur.appendChild(carte);
      continue;
    }

    if (client.mode === 'libre') {
      const { data: produitsHabituels } = await supabaseClient
        .from('clients_reguliers_produits')
        .select('*')
        .eq('client_id', client.id)
        .order('created_at', { ascending: true });

      const lignesDepart = (produitsHabituels && produitsHabituels.length > 0)
        ? produitsHabituels.map(p => p.produit)
        : ['', '', ''];

      carte.innerHTML = `
        <h2>${emoji} ${client.nom}</h2>
        <div id="lignes-libres-${client.id}">
          ${lignesDepart.map(nomProduit => `
            <div class="ligne-produit">
              <input type="text" placeholder="Produit" class="produit-libre" style="flex:2;" value="${nomProduit}">
              <input type="number" min="0" placeholder="Qté" class="quantite-libre">
            </div>
          `).join('')}
        </div>
        <button onclick="ajouterLigneLibre('${client.id}')" style="border:none; background:none; color:var(--accent-dark); font-size:13px; text-decoration:underline; cursor:pointer; padding:0; margin-bottom:6px;">+ Ajouter une ligne</button>
        <button class="primary" onclick='enregistrerCommandeLibre(${JSON.stringify(client.id)}, ${JSON.stringify(client.nom)}, ${JSON.stringify(client.atelier)})'>Enregistrer la commande</button>
        <button class="lien-historique" onclick="basculerHistorique('${client.id}', '${client.nom.replace(/'/g, "\\'")}')">📊 Voir l'historique</button>
        <button class="lien-historique" onclick="telechargerTotalMois('${client.nom.replace(/'/g, "\\'")}')">⬇️ Télécharger le total du mois</button>
        <div id="historique-${client.id}" style="display:none; margin-top:14px;"></div>
      `;
      conteneur.appendChild(carte);
      continue;
    }

    const { data: produits } = await supabaseClient
      .from('clients_reguliers_produits')
      .select('*')
      .eq('client_id', client.id)
      .order('created_at', { ascending: true });

    carte.innerHTML = `
      <h2>${emoji} ${client.nom}</h2>
      ${(produits || []).length === 0 ? '<p class="empty">Aucun produit enregistré.</p>' : (produits || []).map(p => `
        <div class="ligne-produit">
          <span>${p.produit}${p.unite ? ' <small style="opacity:.5;">(' + p.unite + ')</small>' : ''}</span>
          <input type="number" min="0" step="${p.unite === 'kg' ? '0.1' : '1'}" id="qte-${p.id}" placeholder="0">
        </div>
      `).join('')}
      <div id="autres-produits-${client.id}"></div>
      <button onclick="ajouterAutreProduit('${client.id}')" style="border:none; background:none; color:var(--accent-dark); font-size:13px; text-decoration:underline; cursor:pointer; padding:0; margin-bottom:6px;">+ Autre produit</button>
      <button class="primary" onclick='enregistrerCommandeDuMatin(${JSON.stringify(client.id)}, ${JSON.stringify(client.nom)}, ${JSON.stringify(client.atelier)})'>Enregistrer la commande de ce matin</button>
      <button class="lien-historique" onclick="basculerHistorique('${client.id}', '${client.nom.replace(/'/g, "\\'")}')">📊 Voir l'historique</button>
      <button class="lien-historique" onclick="telechargerTotalMois('${client.nom.replace(/'/g, "\\'")}')">⬇️ Télécharger le total du mois</button>
      <div id="historique-${client.id}" style="display:none; margin-top:14px;"></div>
    `;
    conteneur.appendChild(carte);
  }
}

async function telechargerTotalMois(nomClient) {
  const maintenant = new Date();
  const premierJour = dateLocale(new Date(maintenant.getFullYear(), maintenant.getMonth(), 1));
  const dernierJour = dateLocale(new Date(maintenant.getFullYear(), maintenant.getMonth() + 1, 0));

  const { data: commandes, error } = await supabaseClient
    .from('commandes')
    .select('*')
    .eq('client', nomClient)
    .gte('date_retrait', premierJour)
    .lte('date_retrait', dernierJour)
    .order('date_retrait', { ascending: true });

  if (error) { alert('Erreur : ' + error.message); return; }
  if (!commandes || commandes.length === 0) { alert('Aucune commande ce mois-ci pour ' + nomClient + '.'); return; }

  const totaux = {};
  commandes.forEach(c => { totaux[c.produit] = (totaux[c.produit] || 0) + c.quantite; });

  const nomMois = maintenant.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });

  const lignes = [['Client', nomClient], ['Mois', nomMois], [''], ['Produit', 'Quantité totale']];
  Object.keys(totaux).forEach(p => lignes.push([p, totaux[p]]));

  const csv = lignes.map(l => l.map(champ => `"${String(champ).replace(/"/g, '""')}"`).join(';')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const lien = document.createElement('a');
  lien.href = url;
  lien.download = 'total_mois_' + nomClient.replace(/\s+/g, '_') + '_' + dateLocale().slice(0,7) + '.csv';
  document.body.appendChild(lien);
  lien.click();
  document.body.removeChild(lien);
  URL.revokeObjectURL(url);
}

function ajouterLigneLibre(clientId) {
  const conteneur = document.getElementById('lignes-libres-' + clientId);
  const ligne = document.createElement('div');
  ligne.className = 'ligne-produit';
  ligne.innerHTML = `
    <input type="text" placeholder="Produit" class="produit-libre" style="flex:2;">
    <input type="number" min="0" placeholder="Qté" class="quantite-libre">
  `;
  conteneur.appendChild(ligne);
}

async function enregistrerCommandeLibre(clientId, nomClient, atelier) {
  const conteneur = document.getElementById('lignes-libres-' + clientId);
  const champsProduits = conteneur.querySelectorAll('.produit-libre');
  const champsQuantites = conteneur.querySelectorAll('.quantite-libre');
  const auteur = window.profilActuel ? window.profilActuel.nom : null;
  const aujourdhui = dateLocale();

  const lignes = [];
  champsProduits.forEach((input, i) => {
    const produit = input.value.trim();
    const quantite = parseFloat(champsQuantites[i].value) || 0;
    if (produit && quantite > 0) {
      lignes.push({ client: nomClient, produit, quantite, atelier, date_retrait: aujourdhui, prise_par: auteur, notes: 'Client régulier' });
    }
  });

  if (lignes.length === 0) {
    alert('Merci de renseigner au moins un produit et sa quantité.');
    return;
  }

  const { error } = await supabaseClient.from('commandes').insert(lignes);
  if (error) { alert('Erreur : ' + error.message); return; }

  alert('Commande enregistrée (' + lignes.length + ' produit(s)).');

  champsQuantites.forEach(input => input.value = '');
}

function ajouterAutreProduit(clientId) {
  const conteneur = document.getElementById('autres-produits-' + clientId);
  const ligne = document.createElement('div');
  ligne.className = 'ligne-produit';
  ligne.innerHTML = `
    <input type="text" placeholder="Produit" class="autre-produit" style="flex:2;">
    <input type="number" min="0" placeholder="Qté" class="autre-quantite">
  `;
  conteneur.appendChild(ligne);
}

async function enregistrerCommandeDuMatin(clientId, nomClient, atelier) {
  const { data: produits } = await supabaseClient.from('clients_reguliers_produits').select('*').eq('client_id', clientId);
  const auteur = window.profilActuel ? window.profilActuel.nom : null;
  const aujourdhui = dateLocale();

  const lignes = [];
  (produits || []).forEach(p => {
    const input = document.getElementById('qte-' + p.id);
    const quantite = parseInt(input.value) || 0;
    if (quantite > 0) {
      lignes.push({
        client: nomClient, produit: p.produit, quantite, atelier,
        date_retrait: aujourdhui, prise_par: auteur, notes: 'Client régulier'
      });
    }
  });

  const conteneurAutres = document.getElementById('autres-produits-' + clientId);
  if (conteneurAutres) {
    const champsProduits = conteneurAutres.querySelectorAll('.autre-produit');
    const champsQuantites = conteneurAutres.querySelectorAll('.autre-quantite');
    champsProduits.forEach((input, i) => {
      const produit = input.value.trim();
      const quantite = parseFloat(champsQuantites[i].value) || 0;
      if (produit && quantite > 0) {
        lignes.push({
          client: nomClient, produit, quantite, atelier,
          date_retrait: aujourdhui, prise_par: auteur, notes: 'Client régulier — produit ponctuel'
        });
      }
    });
  }

  if (lignes.length === 0) {
    alert('Aucune quantité renseignée.');
    return;
  }

  const { error } = await supabaseClient.from('commandes').insert(lignes);
  if (error) { alert('Erreur : ' + error.message); return; }

  alert('Commande du matin enregistrée (' + lignes.length + ' produit(s)) — elle apparaît maintenant dans les commandes du jour.');

  (produits || []).forEach(p => {
    const input = document.getElementById('qte-' + p.id);
    if (input) input.value = '';
  });

  if (conteneurAutres) conteneurAutres.innerHTML = '';
}

let historiqueParClient = {};

async function basculerHistorique(clientId, nomClient) {
  const zone = document.getElementById('historique-' + clientId);

  if (zone.style.display === 'block') {
    zone.style.display = 'none';
    return;
  }

  zone.style.display = 'block';
  zone.innerHTML = '<p class="empty">Chargement...</p>';

  const { data: commandes, error } = await supabaseClient
    .from('commandes')
    .select('*')
    .eq('client', nomClient)
    .order('date_retrait', { ascending: false });

  if (error) { zone.innerHTML = `<p class="empty">Erreur : ${error.message}</p>`; return; }
  if (!commandes || commandes.length === 0) { zone.innerHTML = '<p class="empty">Aucun historique pour l\'instant.</p>'; return; }

  const { data: produitsClient } = await supabaseClient.from('clients_reguliers_produits').select('*').eq('client_id', clientId);
  const unitesParProduit = {};
  (produitsClient || []).forEach(p => { unitesParProduit[p.produit] = p.unite || ''; });

  const parJour = {};
  const totaux = {};
  commandes.forEach(c => {
    if (!parJour[c.date_retrait]) parJour[c.date_retrait] = [];
    parJour[c.date_retrait].push(c);
    totaux[c.produit] = (totaux[c.produit] || 0) + c.quantite;
  });

  historiqueParClient[clientId] = { parJour, totaux, jourOuvert: null, nomClient, unitesParProduit };
  afficherHistorique(clientId);
}

function afficherHistorique(clientId) {
  const zone = document.getElementById('historique-' + clientId);
  const { parJour, totaux, jourOuvert, unitesParProduit } = historiqueParClient[clientId];

  let html = '<h4 style="margin:0 0 8px; font-size:13px; opacity:.6; text-transform:uppercase;">Total cumulé</h4>';
  html += Object.keys(totaux).map(p => `
    <div style="display:flex; justify-content:space-between; font-size:14px; padding:4px 0;">
      <span>${p}</span><strong>${totaux[p]}${unitesParProduit[p] ? ' ' + unitesParProduit[p] + (unitesParProduit[p] === 'pièce' && totaux[p] > 1 ? 's' : '') : ''}</strong>
    </div>`).join('');

  html += '<h4 style="margin:16px 0 8px; font-size:13px; opacity:.6; text-transform:uppercase;">Choisir un jour</h4>';

  html += Object.keys(parJour).sort().reverse().map(jour => {
    const actif = jourOuvert === jour;
    const libelle = jour.slice(8,10) + '/' + jour.slice(5,7) + '/' + jour.slice(0,4);
    let bloc = `
      <div onclick="ouvrirJourHistorique('${clientId}', '${jour}')" style="cursor:pointer; padding:10px 0; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
        <strong style="font-size:14px;">${libelle}</strong>
        <span style="font-size:13px; opacity:.5;">${actif ? '▲' : '▼'}</span>
      </div>`;
    if (actif) {
      bloc += parJour[jour].map(c => `<div style="font-size:13px; opacity:.8; padding:6px 0 6px 10px;">${c.produit} × ${c.quantite}${unitesParProduit[c.produit] ? ' ' + unitesParProduit[c.produit] + (unitesParProduit[c.produit] === 'pièce' && c.quantite > 1 ? 's' : '') : ''}</div>`).join('');
    }
    return bloc;
  }).join('');

  html += `<button class="primary" onclick="telechargerHistoriqueCSV('${clientId}')">⬇️ Télécharger l'historique (Excel)</button>`;

  zone.innerHTML = html;
}

function telechargerHistoriqueCSV(clientId) {
  const { parJour, nomClient } = historiqueParClient[clientId];
  if (!parJour) { alert('Aucun historique à télécharger.'); return; }

  const lignes = [['Date', 'Produit', 'Quantité']];
  Object.keys(parJour).sort().forEach(jour => {
    const libelle = jour.slice(8,10) + '/' + jour.slice(5,7) + '/' + jour.slice(0,4);
    parJour[jour].forEach(c => {
      lignes.push([libelle, c.produit, c.quantite]);
    });
  });

  const csv = lignes.map(l => l.map(champ => `"${String(champ).replace(/"/g, '""')}"`).join(';')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const lien = document.createElement('a');
  lien.href = url;
  lien.download = 'historique_' + nomClient.replace(/\s+/g, '_') + '_' + dateLocale() + '.csv';
  document.body.appendChild(lien);
  lien.click();
  document.body.removeChild(lien);
  URL.revokeObjectURL(url);
}

function ouvrirJourHistorique(clientId, jour) {
  const etat = historiqueParClient[clientId];
  etat.jourOuvert = (etat.jourOuvert === jour) ? null : jour;
  afficherHistorique(clientId);
}

async function creerClientRegulier() {
  const nom = document.getElementById('nom-client').value.trim();
  const atelier = document.getElementById('atelier-client').value;
  const produitsTexte = document.getElementById('produits-client').value;

  if (!nom) { alert('Merci de donner un nom.'); return; }

  const produitsListe = produitsTexte.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  if (produitsListe.length === 0) { alert('Ajoute au moins un produit.'); return; }

  const { data: client, error } = await supabaseClient.from('clients_reguliers').insert([{ nom, atelier }]).select().single();
  if (error) { alert('Erreur : ' + error.message); return; }

  const lignes = produitsListe.map(p => ({ client_id: client.id, produit: p }));
  const { error: erreurProduits } = await supabaseClient.from('clients_reguliers_produits').insert(lignes);
  if (erreurProduits) { alert('Erreur : ' + erreurProduits.message); return; }

  document.getElementById('nom-client').value = '';
  document.getElementById('produits-client').value = '';
  chargerClientsReguliers();
}

initProfil((profil) => {
  window.profilActuel = profil;
  chargerClientsReguliers();
});

</script>
</body>
</html>
