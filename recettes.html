<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recettes — Boulangerie Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#FAF7F2; --surface:#FFFFFF; --ink:#241A14;
    --accent:#C68A2E; --accent-dark:#9C6B1E; --radius:18px;
  }
  *{box-sizing:border-box;}
  body{font-family:'Inter',Arial,sans-serif; margin:0; background:var(--bg); color:var(--ink);}
  header{background:var(--ink); color:#fff; padding:22px 20px; display:flex; align-items:center; justify-content:space-between;}
  header h1{margin:0; font-family:'Fraunces',serif; font-size:22px;}
  header a{color:#fff; opacity:.7; text-decoration:none; font-size:13px;}
  main{padding:20px; max-width:700px; margin:auto;}
  .card{background:var(--surface); border-radius:var(--radius); padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06);}
  .card h2{margin-top:0; font-family:'Fraunces',serif; font-size:19px;}
  label{display:block; font-size:13px; opacity:.7; margin:10px 0 4px;}
  input, textarea{width:100%; padding:12px; border-radius:10px; border:1px solid #ddd; font-size:15px; font-family:inherit;}
  textarea{min-height:80px; resize:vertical;}
  button.primary{
    margin-top:16px; width:100%; border:none; background:var(--accent); color:#241A14;
    padding:14px; border-radius:12px; font-size:16px; font-weight:600;
  }
  button.primary:active{transform:scale(0.98);}
  .task{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:14px 0; border-bottom:1px solid #eee;}
  .task:last-child{border-bottom:none;}
  .task span{font-family:'Fraunces',serif; font-size:16px; font-weight:600;}
  .empty{opacity:.5; font-size:14px; padding:10px 0;}
</style>
</head>
<body>

<header>
  <h1 id="titre-page">📖 Recettes</h1>
  <div style="text-align:right;">
    <span id="bandeau-profil" style="display:block;font-size:12px;opacity:.8;"></span>
    <a href="index.html" title="Accueil" style="display:inline-block;width:32px;height:32px;line-height:32px;border-radius:50%;background:var(--accent);color:#241A14;text-decoration:none;font-size:16px;vertical-align:middle;">🏠</a>
    <button onclick="effacerProfil()" title="Changer de profil" style="width:40px;height:40px;border-radius:50%;border:none;background:var(--accent);color:#241A14;font-size:20px;cursor:pointer;margin-left:8px;vertical-align:middle;padding:0;">👨‍🍳</button>
  </div>
</header>

<main>
  <div class="card" id="card-ajout-recette">
    <h2>Ajouter une recette</h2>
    <label>Nom de la recette</label>
    <input id="nom" placeholder="ex: Pain de campagne">

    <label>Fiche recette (PDF)</label>
    <input id="pdf-recette" type="file" accept="application/pdf">

    <button class="primary" id="btn-ajouter-recette" onclick="ajouterRecette()">Ajouter la recette</button>
  </div>

  <div class="card">
    <h2>Toutes les recettes</h2>
    <div id="liste-recettes">
      <p class="empty">Chargement...</p>
    </div>
  </div>
</main>

<script src="supabase-config.js?v=3"></script>
<script src="profil.js?v=3"></script>
<script>

// Récupère l'atelier depuis l'adresse de la page, ex: recettes.html?atelier=boulangerie
const params = new URLSearchParams(window.location.search);
const atelier = params.get('atelier') === 'patisserie' ? 'patisserie' : 'boulangerie';

document.getElementById('titre-page').textContent =
  atelier === 'patisserie' ? '🧁 Recettes — Pâtisserie' : '🍞 Recettes — Boulangerie';

async function chargerRecettes() {
  const { data, error } = await supabaseClient
    .from('recettes')
    .select('*')
    .eq('atelier', atelier)
    .order('nom', { ascending: true });

  const conteneur = document.getElementById('liste-recettes');

  if (error) {
    conteneur.innerHTML = `<p class="empty">Erreur de chargement : ${error.message}</p>`;
    return;
  }

  if (!data || data.length === 0) {
    conteneur.innerHTML = `<p class="empty">Aucune recette pour l'instant.</p>`;
    return;
  }

  conteneur.innerHTML = data.map(r => `
    <div class="task">
      <span>${r.nom}</span>
      ${r.pdf_url
        ? `<button onclick="voirPdf('${r.pdf_url}')" class="small" style="border:none; background:var(--ink); color:#fff; padding:10px 15px; border-radius:10px; font-size:14px; cursor:pointer; font-family:inherit;">📄 Voir le PDF</button>`
        : `<span style="opacity:.4; font-size:13px;">Aucun PDF</span>`}
    </div>
  `).join('');
}

function voirPdf(url) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(36,26,20,.8);z-index:9998;display:flex;flex-direction:column;padding:16px;';
  const urlVisionneuse = 'https://mozilla.github.io/pdf.js/web/viewer.html?file=' + encodeURIComponent(url);
  overlay.innerHTML = `
    <button onclick="this.parentElement.remove()" style="align-self:flex-end; border:none; background:#fff; color:#241A14; padding:10px 18px; border-radius:10px; font-size:14px; font-weight:600; margin-bottom:10px;">✕ Fermer</button>
    <iframe src="${urlVisionneuse}" style="flex:1; width:100%; border:none; border-radius:12px; background:#fff;"></iframe>
  `;
  document.body.appendChild(overlay);
}

function nettoyerNomFichier(nom) {
  return nom
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // enlève les accents
    .replace(/[^a-zA-Z0-9._-]/g, '_'); // remplace tout caractère non autorisé par _
}

async function ajouterRecette() {
  if (!window.profilActuel || window.profilActuel.role !== 'chef') {
    alert("Seul le chef peut ajouter une recette.");
    return;
  }

  const bouton = document.getElementById('btn-ajouter-recette');
  const nom = document.getElementById('nom').value.trim();
  const fichier = document.getElementById('pdf-recette').files[0];

  if (!nom) {
    alert('Merci de donner un nom à la recette.');
    return;
  }

  bouton.disabled = true;
  bouton.textContent = 'Enregistrement...';

  let pdf_url = null;

  if (fichier) {
    const nomFichier = Date.now() + '-' + nettoyerNomFichier(fichier.name);
    const { error: erreurUpload } = await supabaseClient.storage.from('Recettes').upload(nomFichier, fichier);
    if (erreurUpload) {
      alert("Erreur lors de l'envoi du PDF : " + erreurUpload.message);
      bouton.disabled = false;
      bouton.textContent = 'Ajouter la recette';
      return;
    }
    const { data: urlData } = supabaseClient.storage.from('Recettes').getPublicUrl(nomFichier);
    pdf_url = urlData.publicUrl;
  }

  const { error } = await supabaseClient.from('recettes').insert([
    { nom, atelier, pdf_url }
  ]);

  bouton.disabled = false;
  bouton.textContent = 'Ajouter la recette';

  if (error) {
    alert('Erreur : ' + error.message);
    return;
  }

  document.getElementById('nom').value = '';
  document.getElementById('pdf-recette').value = '';
  chargerRecettes();
}

// On attend de savoir qui utilise la tablette avant de charger la page
initProfil((profil) => {
  window.profilActuel = profil;

  if (profil.role !== 'chef') {
    document.getElementById('card-ajout-recette').style.display = 'none';
  }

  chargerRecettes();

  supabaseClient
    .channel('recettes-' + atelier)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'recettes' }, chargerRecettes)
    .subscribe();
}, atelier);

</script>
</body>
</html>
